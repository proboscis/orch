rules:
  - id: adr0005-no-warning-only-kill-failure
    languages: [go]
    message: >
      ADR-0005 R3/LS6: a failed session kill must propagate as an error, never
      be reduced to a warning-only log.
    patterns:
      - pattern-inside: |
          if $ERR := $MUX.KillSession(...); $ERR != nil {
            ...
          }
      - pattern: $LOGGER.Printf($FORMAT, ...)
      - metavariable-regex:
          metavariable: $FORMAT
          regex: '.*warning: failed to kill session.*'
    paths:
      include:
        - /internal/daemon/
        - /.semgrep/adr0005-no-warning-only-kill-failure/
    severity: ERROR
    metadata:
      category: invariant
      violation: silent-session-kill-failure
