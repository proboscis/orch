          func (s *SocketServer) handleProtoContinueRun(req *orchpb.ContinueRunRequest) *orchpb.Response {
            ...
          }
      - pattern: s.processContinueRunCore($STORE, $ROOT, $OPTS)
      - pattern-not-inside: |
          s.withWorkerLease(..., func(...) error {
            ...
            s.processContinueRunCore($STORE, $ROOT, $OPTS)
            ...
          })
    paths:
      include:
        - /internal/daemon/proto_handler.go
    message: >
      Phase-4 guardrail: continue_run execution side effects must be routed through
      worker lease path (withWorkerLease), not invoked directly.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: worker-plane

  - id: daemon-proto-stop-run-must-use-worker-lease
    patterns:
      - pattern-inside: |
          func (s *SocketServer) handleProtoStopRun(req *orchpb.StopRunRequest) *orchpb.Response {
            ...
          }
      - pattern: s.stopSingleRun($RUN, $STORE)
      - pattern-not-inside: |
          s.withWorkerLease(..., func(...) error {
            ...
            s.stopSingleRun($RUN, $STORE)
            ...
          })
    paths:
      include:
        - /internal/daemon/proto_handler.go
    message: >
      Phase-4 guardrail: stop_run side effects must be routed through worker lease
      path (withWorkerLease), not invoked directly.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: worker-plane

  # ---------------------------------------------------------------------------
  # 7. Transport contract fidelity: prevent Message field overloading
  # ---------------------------------------------------------------------------

  - id: daemon-proto-no-message-overload-model
    patterns:
      - pattern: |
          SendRequest{..., Message: req.Model, ...}
    paths:
      include:
        - /internal/daemon/proto_handler.go
    message: >
      Proto handler must not overload SendRequest.Message with req.Model.
      Use the dedicated SendRequest.Model field instead.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: field-overload

  - id: daemon-proto-no-message-overload-tmux
    patterns:
      - pattern: |
          SendRequest{..., Message: req.SessionName, ...}
    paths:
      include:
        - /internal/daemon/proto_handler.go
    message: >
      Proto handler must not overload SendRequest.Message with req.SessionName.
      Use the dedicated SendRequest.SessionName field instead.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: field-overload

  - id: daemon-socket-no-message-model-consumption
    patterns:
      - pattern: |
          metadata["model"] = req.Message
    paths:
      include:
        - /internal/daemon/socket.go
    message: >
      Do not read model from req.Message. Use req.Model instead.
      The Message field was previously overloaded for model; use the dedicated field.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: field-overload

  - id: daemon-socket-no-message-tmux-consumption
    patterns:
      - pattern: |
          $SESSION := req.Message
    paths:
      include:
        - /internal/daemon/socket.go
      exclude:
        - /internal/daemon/*_test.go
    message: >
      Do not read session name from req.Message. Use req.SessionName instead.
      The Message field was previously overloaded for tmux session; use the dedicated field.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: field-overload

  # ---------------------------------------------------------------------------
  # 8. Identity collision guardrails: prevent bare basename fallbacks
  # ---------------------------------------------------------------------------

  - id: daemon-no-repoid-basename-fallback
    patterns:
      - pattern: return filepath.Base($X), nil
    paths:
      include:
        - /internal/xdg/paths.go
        - /internal/daemon/socket.go
      exclude:
        - "*_test.go"
    message: >
      Do not return bare filepath.Base() as a repo ID.
      Bare basenames cause collisions when repos share the same directory name.
      Fix: require repo identity from explicit input or git remote metadata instead.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: identity-collision

  - id: daemon-no-implicit-repoid-fallback
    patterns:
      - pattern: $ID = filepath.Base($PATH)
    paths:
      include:
        - /internal/xdg/paths.go
        - /internal/daemon/socket.go
      exclude:
        - "*_test.go"
    message: >
      Do not assign filepath.Base() directly as a repo ID fallback.
      Bare basenames cause collisions when repos share the same directory name.
      Fix: use a hash-suffixed or hash-only derivation.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: identity-collision

  # ---------------------------------------------------------------------------
  # 9. Incremental migration guardrails (prevent boundary debt expansion)
  # ---------------------------------------------------------------------------

  - id: monitor-no-daemon-import-incremental
    patterns:
      - pattern: |
          import (
            ...
            "github.com/proboscis/orch/internal/daemon"
            ...
          )
    paths:
      include:
        - /internal/monitor/
      exclude:
        - /internal/monitor/*_test.go
    message: >
      Monitor should not import internal/daemon directly. Use orchapi as the
      boundary and move daemon lifecycle/health operations behind API methods.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: abstraction-bypass

  - id: monitor-no-store-import-incremental
    patterns:
      - pattern: |
          import (
            ...
            "github.com/proboscis/orch/internal/store"
            ...
          )
    paths:
      include:
        - /internal/monitor/
      exclude:
        - /internal/monitor/*_test.go
    message: >
      Monitor should not import internal/store directly. Store access must be
      daemon-owned and exposed via orchapi.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: daemon-bypass

  - id: cli-no-worktree-fs-check-incremental
    patterns:
      - pattern-either:
          - pattern: os.Stat($PATH)
          - pattern: os.Lstat($PATH)
      - metavariable-regex:
          metavariable: $PATH
          regex: .*[Ww]orktree.*
    paths:
      include:
        - /internal/cli/
      exclude:
        - /internal/cli/*_test.go
    message: >
      CLI must not perform direct worktree filesystem checks. Use daemon-returned
      run metadata (worktree_exists/branch_state) via orchapi.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: daemon-bypass

  - id: daemon-proto-no-new-jsoncapture-bridge
    patterns:
      - pattern: json.Unmarshal($BUF.data, &$RESULT)
    paths:
      include:
        - /internal/daemon/proto_handler.go
      exclude:
        - /internal/daemon/*_test.go
    message: >
      Do not add new proto->JSON capture bridges in proto handlers. Route
      through shared typed service methods instead of jsonCapture bridges.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: transport-drift

  # ---------------------------------------------------------------------------
  # 10. Exec boundaries and legacy tmux guardrails
  # ---------------------------------------------------------------------------

  - id: no-legacy-tmux-import
    patterns:
      - pattern: |
          import (
            ...
            "github.com/proboscis/orch/internal/tmux"
            ...
          )
    paths:
      include:
        - /internal/
      exclude:
        - "*_test.go"
    message: >
      Use internal/multiplexer.Multiplexer interface instead of legacy internal/tmux package.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: boundary-enforcement

  - id: no-raw-exec-in-boundary-layers
    patterns:
      - pattern-either:
          - pattern: exec.Command(...)
          - pattern: exec.CommandContext(...)
    paths:
      include:
        - /internal/daemon/
        - /internal/cli/
        - /internal/monitor/
      exclude:
        # Daemon-managed process lifecycle exceptions
        - /internal/daemon/daemon.go
        - /internal/daemon/socket.go
        - /internal/daemon/worker_autostart.go
        # CLI UX/runtime exceptions
        - /internal/cli/exec.go
        - /internal/cli/log.go
        - /internal/cli/open.go
        - /internal/cli/attach.go
        - /internal/cli/agent.go
        - /internal/cli/diff.go
        # Monitor UI launcher exceptions
        - /internal/monitor/dashboard.go
        - /internal/monitor/issues_dashboard.go
        - /internal/monitor/monitor.go
        - "*_test.go"
    message: >
      Raw exec.Command/exec.CommandContext in daemon/cli/monitor layers.
      Use the appropriate interface: git.Runner, github.Client, ProcessManager,
      multiplexer.Multiplexer, orchapi.OrchAPI, or agent.Adapter.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: boundary-enforcement

  - id: no-raw-unix-socket-dial
    patterns:
      - pattern-either:
          - pattern: net.DialTimeout("unix", ...)
          - pattern: net.Dial("unix", ...)
    paths:
      include:
        - /internal/cli/
        - /internal/monitor/
        - /internal/orchapi/
        - /internal/daemon/
      exclude:
        - /internal/daemon/proto_client.go
        - /internal/daemon/startup_recovery.go
        - /internal/daemon/*_test.go
        - /internal/cli/*_test.go
        - /internal/monitor/*_test.go
        - /internal/orchapi/*_test.go
    message: >
      CRITICAL (orch-447): do not create raw Unix socket connections in client
      request paths. Route daemon communication through ProtoClient's
      persistent connection manager to prevent socket churn regressions.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: socket-churn

  - id: no-oneshot-health-probe-socket
    patterns:
      - pattern: |
          (defn _probe-daemon-health ...)
    paths:
      include:
        - /orch-monitor-tui/orch_monitor/proto_client.hy
    message: >
      CRITICAL (orch-447): avoid one-shot daemon health probe sockets in the
      Python/Hy monitor. Availability checks must use the persistent
      ProtoDaemonClient channel.
    severity: ERROR
    languages: [generic]
    metadata:
      category: architecture
      violation: socket-churn

  # ---------------------------------------------------------------------------
  # 11. PR cache enforcement: daemon must use cached/batched PR lookups
  #
  # The daemon MUST NOT call uncached PR lookup functions directly.
  # These functions shell out to `gh` CLI on every call with no caching,
  # which exhausts the GitHub API rate limit (5000/hr) with just ~4 active runs.
  #
  # Allowed: pr.PopulateRunInfo() / pr.PopulateRunInfoWithClient() — batched + cached
  # Banned:  pr.LookupInfo() / pr.LookupInfoByURL() / pr.LookupInfoWithClient()
  #
  # Tracked by: orch-450
  # ---------------------------------------------------------------------------

  - id: daemon-no-uncached-pr-lookup
    patterns:
      - pattern-either:
          - pattern: pr.LookupInfo(...)
          - pattern: pr.LookupInfoWithClient(...)
    paths:
      include:
        - /internal/daemon/
      exclude:
        - /internal/daemon/*_test.go
    message: >
      Daemon must not call pr.LookupInfo() or pr.LookupInfoWithClient() directly.
      These bypass the PR cache and shell out to `gh pr list` on every call,
      exhausting the GitHub API rate limit (5000/hr).
      Fix: Use pr.PopulateRunInfo() or pr.PopulateRunInfoWithClient() which
      batch lookups and respect cache TTLs (cacheHitTTL, cacheMissTTL, cacheMaxFetches).
      See: orch-450
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: rate-limit-bypass

  - id: daemon-no-uncached-pr-lookup-by-url
    patterns:
      - pattern: pr.LookupInfoByURL(...)
    paths:
      include:
        - /internal/daemon/
      exclude:
        - /internal/daemon/*_test.go
    message: >
      Daemon must not call pr.LookupInfoByURL() directly.
      This bypasses the PR cache and shells out to `gh pr view` on every call,
      exhausting the GitHub API rate limit (5000/hr).
      Fix: Use a cache-aware lookup that respects TTLs, or batch via PopulateRunInfo.
      See: orch-450
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: rate-limit-bypass

  # ---------------------------------------------------------------------------
  # 12. Control-agent split guardrails (remote-safe monitor architecture)
  # ---------------------------------------------------------------------------

  - id: monitor-no-control-agent-launch-rpc
    patterns:
      - pattern: $API.GetControlAgentLaunch(...)
    paths:
      include:
        - /internal/monitor/
      exclude:
        - /internal/monitor/*_test.go
    message: >
      Monitor must not call GetControlAgentLaunch() directly.
      For remote-safe architecture, monitor should use GetControlAgentConfig()
      and manage local control-agent session lifecycle client-side.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: control-agent-split

  # ---------------------------------------------------------------------------
  # 13. Remote session control must route through daemon/worker protocol
  # ---------------------------------------------------------------------------

  - id: cli-no-direct-ssh-session-control
    patterns:
      - pattern: exec.Command("ssh", ...)
    paths:
      include:
        - /internal/cli/
      exclude:
        - /internal/cli/*_test.go
        - /internal/cli/attach.go
    message: >
      CLI must not invoke ssh directly for remote session control.
      Route send/capture/git inspection through the daemon protobuf API so
      worker routing, escaping, and errors stay centralized.
      Interactive attach is the only current exception.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: daemon-bypass

  - id: cli-no-remote-control-ssh-helpers
    patterns:
      - pattern-either:
          - pattern: runSSHOutputArgs(...)
          - pattern: runSSHScriptOutput(...)
          - pattern: runRemotePython(...)
    paths:
      include:
        - /internal/cli/
      exclude:
        - /internal/cli/*_test.go
    message: >
      CLI must not use ad hoc SSH helpers for remote session control.
      Use orchapi.OrchAPI methods so the daemon owns host routing and
      transport details.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: daemon-bypass

  # ---------------------------------------------------------------------------
  # 14. Fail-fast guardrails
  # ---------------------------------------------------------------------------

  - id: daemon-no-swallowed-recover
    patterns:
      - pattern-either:
          - patterns:
              - pattern: |
                  if $R := recover(); $R != nil {
                    ...
                  }
              - pattern-not: |
                  if $R := recover(); $R != nil {
                    ...
                    panic($R)
                    ...
                  }
              - pattern-not: |
                  if $R := recover(); $R != nil {
                    ...
                    logAndRepanic(..., $R)
                    ...
                  }
              - pattern-not: |
                  if $R := recover(); $R != nil {
                    ...
                    os.Exit(...)
                    ...
                  }
          - patterns:
              - pattern: recover()
              - pattern-not-inside: |
                  if $R := recover(); $R != nil {
                    ...
                  }
    paths:
      include:
        - /internal/daemon/
        - /test/semgrep/internal/daemon/
      exclude:
        - /internal/daemon/*_test.go
    message: >
      Daemon recover() must not swallow panics. Log and re-panic via
      logAndRepanic(), call panic(r), or terminate explicitly so failures are
      visible instead of silently hidden.
    severity: ERROR
    languages: [go]
    metadata:
      category: fail-fast
      violation: swallowed-recover

  - id: fail-fast-no-discard-status-parse-error
    patterns:
