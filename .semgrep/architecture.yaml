rules:
  # ===========================================================================
  # BOUNDARY: CLI layer allowed imports
  #
  # CLI code (internal/cli/) MUST only interact with the daemon through:
  #   - orchapi.OrchAPI interface (via getAPI())
  #   - model types for display formatting
  #   - agent display helpers (AgentDisplayName etc.)
  #
  # CLI code MUST NOT import or use:
  #   - internal/git (git operations belong in daemon)
  #   - internal/pr (PR lookups belong in daemon)
  #   - internal/store (data access belongs in daemon)
  #   - internal/config (config should come from daemon, except bootstrap)
  #   - internal/daemon directly (use orchapi interface, except bootstrap)
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # 1. Forbidden package imports from CLI
  # ---------------------------------------------------------------------------

  - id: cli-no-git-import
    patterns:
      - pattern: |
          import (
            ...
            "github.com/s22625/orch/internal/git"
            ...
          )
    paths:
      include:
        - /internal/cli/
      exclude:
        - /internal/cli/*_test.go
    message: >
      CLI must not import internal/git. All git operations (repo root, branch,
      worktree, diff, merge state) must go through the daemon API.
      Fix: Use orchapi.OrchAPI methods like GetDiff, GetBranchState, GetDiffStats.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: daemon-bypass

  - id: cli-no-pr-import
    patterns:
      - pattern: |
          import (
            ...
            "github.com/s22625/orch/internal/pr"
            ...
          )
    paths:
      include:
        - /internal/cli/
      exclude:
        - /internal/cli/*_test.go
    message: >
      CLI must not import internal/pr. PR lookups must go through the daemon API
      (daemon handles caching and rate limiting).
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: daemon-bypass

  - id: cli-no-store-import
    patterns:
      - pattern: |
          import (
            ...
            "github.com/s22625/orch/internal/store"
            ...
          )
    paths:
      include:
        - /internal/cli/
      exclude:
        - /internal/cli/*_test.go
    message: >
      CLI must not import internal/store. All data access goes through the daemon.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: daemon-bypass

  - id: cli-no-store-file-import
    patterns:
      - pattern: |
          import (
            ...
            "github.com/s22625/orch/internal/store/file"
            ...
          )
    paths:
      include:
        - /internal/cli/
      exclude:
        - /internal/cli/*_test.go
    message: >
      CLI must not import internal/store/file. All data access goes through the daemon.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: daemon-bypass

  - id: cli-no-config-import
    patterns:
      - pattern: |
          import (
            ...
            "github.com/s22625/orch/internal/config"
            ...
          )
    paths:
      include:
        - /internal/cli/
      exclude:
        - /internal/cli/*_test.go
        # Bootstrap exceptions: these need config before daemon is available
        - /internal/cli/root.go
        - /internal/cli/daemon.go
        # notify.go needs to pass config.SlackConfig to notify package
        - /internal/cli/notify.go
    message: >
      CLI should not import internal/config directly. Config should flow from the
      daemon via API responses or a GetConfig RPC. Bootstrap exceptions: root.go, daemon.go.
      Fix: Move config-dependent logic to daemon, or add config fields to API responses.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: config-scatter

  - id: cli-no-daemon-import
    patterns:
      - pattern: |
          import (
            ...
            "github.com/s22625/orch/internal/daemon"
            ...
          )
    paths:
      include:
        - /internal/cli/
      exclude:
        - /internal/cli/*_test.go
        # Bootstrap/management exceptions
        - /internal/cli/root.go
        - /internal/cli/daemon.go
        - /internal/cli/monitor.go
        - /internal/cli/repair.go
    message: >
      CLI should use orchapi.OrchAPI interface (via getAPI()), not the daemon package.
      Direct daemon access bypasses the API abstraction layer.
      Exceptions: root.go (ensureDaemon), daemon.go (daemon commands), monitor.go (monitor launch), repair.go (daemon lifecycle management).
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: abstraction-bypass

  # ---------------------------------------------------------------------------
  # 2. Forbidden direct operations from CLI
  # ---------------------------------------------------------------------------

  - id: cli-no-exec-git
    patterns:
      - pattern: exec.Command("git", ...)
    paths:
      include:
        - /internal/cli/
      exclude:
        - /internal/cli/*_test.go
    message: >
      CLI must not shell out to git via exec.Command("git", ...).
      Use daemon API: GetDiff, GetDiffStats, GetBranchState.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: daemon-bypass

  - id: cli-no-git-find-repo
    patterns:
      - pattern: git.FindMainRepoRoot(...)
    paths:
      include:
        - /internal/cli/
      exclude:
        - /internal/cli/*_test.go
    message: >
      CLI must not call git.FindMainRepoRoot(). The daemon knows the repo root.
      Fix: Use getProjectRoot() or get it from daemon API responses.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: daemon-bypass

  - id: cli-no-git-branch-ops
    patterns:
      - pattern-either:
          - pattern: git.GetCurrentBranch(...)
          - pattern: git.FindWorktreesByBranch(...)
          - pattern: git.CreateWorktreeFromBranch(...)
          - pattern: git.CreateWorktree(...)
          - pattern: git.GetAheadCount(...)
          - pattern: git.HasUncommittedChanges(...)
    paths:
      include:
        - /internal/cli/
      exclude:
        - /internal/cli/*_test.go
    message: >
      CLI must not perform git operations directly. Branch verification, worktree
      creation, and state checks must go through the daemon API.
      Fix: For 'continue', add a ContinueRun daemon RPC that handles orchestration.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: daemon-bypass

  - id: cli-no-pr-lookup
    patterns:
      - pattern: pr.LookupInfo(...)
    paths:
      include:
        - /internal/cli/
      exclude:
        - /internal/cli/*_test.go
    message: >
      CLI must not call pr.LookupInfo() directly. PR lookups go through the daemon
      (which handles caching and rate limiting).
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: daemon-bypass

  - id: cli-no-agent-manager
    patterns:
      - pattern-either:
          - pattern: agent.GetManager(...)
          - pattern: agent.RefreshMuxCache()
    paths:
      include:
        - /internal/cli/
      exclude:
        - /internal/cli/*_test.go
    message: >
      CLI must not check agent liveness via agent.GetManager()/RefreshMuxCache().
      The daemon computes alive status and returns it in API responses (Alive, AliveKnown fields).
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: daemon-bypass

  - id: cli-no-opencode-client
    patterns:
      - pattern: agent.NewOpenCodeClient(...)
    paths:
      include:
        - /internal/cli/
      exclude:
        - /internal/cli/*_test.go
    message: >
      CLI must not create OpenCodeClient directly.
      All OpenCode interactions go through the daemon (EnsureOpenCodeServer, QueryOpenCodeServer).
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: daemon-bypass

  - id: cli-no-send-via-daemon
    patterns:
      - pattern: daemon.SendViaDaemon(...)
    paths:
      include:
        - /internal/cli/
      exclude:
        - /internal/cli/*_test.go
    message: >
      CLI must not call daemon.SendViaDaemon() directly.
      Use orchapi.OrchAPI.SendMessage() through the getAPI() interface.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: abstraction-bypass

  - id: cli-no-proto-client-direct
    patterns:
      - pattern-either:
          - pattern: daemon.NewProtoClient(...)
          - pattern: daemon.NewProtoClientWithIssuesRoot(...)
    paths:
      include:
        - /internal/cli/
      exclude:
        - /internal/cli/*_test.go
        - /internal/cli/daemon.go
    message: >
      CLI must not construct ProtoClient directly. Use getAPI() which returns
      an orchapi.OrchAPI interface. This maintains the abstraction boundary.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: abstraction-bypass

  - id: cli-no-daemon-process-checks
    patterns:
      - pattern-either:
          - pattern: daemon.IsRunning(...)
          - pattern: daemon.GetRunningPID(...)
          - pattern: daemon.IsDaemonSocketAvailable(...)
    paths:
      include:
        - /internal/cli/
      exclude:
        - /internal/cli/*_test.go
        - /internal/cli/daemon.go
        - /internal/cli/repair.go
    message: >
      CLI should not check daemon process state directly.
      Use orchapi.Ping() or the getAPI() auto-start mechanism.
      Exceptions: daemon.go (daemon management), repair.go (repair ops).
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: abstraction-bypass

  # ---------------------------------------------------------------------------
  # 3. Forbidden filesystem operations from CLI
  # ---------------------------------------------------------------------------

  - id: cli-no-file-open
    patterns:
      - pattern-either:
          - pattern: os.Open(...)
          - pattern: os.OpenFile(...)
          - pattern: os.Create(...)
    paths:
      include:
        - /internal/cli/
      exclude:
        - /internal/cli/*_test.go
    message: >
      CLI should not use os.Open/OpenFile/Create directly.
      File operations should go through the daemon API (ReadFile, WriteFile).
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: daemon-bypass

  - id: cli-no-file-readwrite
    patterns:
      - pattern-either:
          - pattern: os.ReadFile(...)
          - pattern: os.WriteFile(...)
    paths:
      include:
        - /internal/cli/
      exclude:
        - /internal/cli/*_test.go
        - /internal/cli/issue.go
    message: >
      CLI must not read/write files directly.
      Use orchapi.OrchAPI.ReadFile()/WriteFile() through the daemon.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: daemon-bypass

  - id: cli-no-mkdir-issues
    patterns:
      - pattern: os.MkdirAll(...)
    paths:
      include:
        - /internal/cli/
      exclude:
        - /internal/cli/*_test.go
        - /internal/cli/issue.go
    message: >
      CLI must not create directories directly. Directory creation for issues/runs
      should be handled by the daemon (CreateIssue, CreateRun).
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: daemon-bypass

  - id: cli-no-multiplexer-direct
    patterns:
      - pattern-either:
          - pattern: multiplexer.GetDefault()
          - pattern: $MUX.SendKeys(...)
          - pattern: $MUX.SendKeysLiteral(...)
    paths:
      include:
        - /internal/cli/
      exclude:
        - /internal/cli/*_test.go
    message: >
      CLI must not interact with multiplexer (tmux/zellij) directly for message sending.
      Use daemon API for agent interactions. Attach is acceptable as a UI concern.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: daemon-bypass

  # ---------------------------------------------------------------------------
  # 4. Monitor boundary rules (same principles apply)
  # ---------------------------------------------------------------------------

  - id: monitor-no-git-import
    patterns:
      - pattern: |
          import (
            ...
            "github.com/s22625/orch/internal/git"
            ...
          )
    paths:
      include:
        - /internal/monitor/
      exclude:
        - /internal/monitor/*_test.go
    message: >
      Monitor must not import internal/git. All git operations must go through
      the daemon API.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: daemon-bypass

  - id: monitor-no-pr-import
    patterns:
      - pattern: |
          import (
            ...
            "github.com/s22625/orch/internal/pr"
            ...
          )
    paths:
      include:
        - /internal/monitor/
      exclude:
        - /internal/monitor/*_test.go
    message: >
      Monitor must not import internal/pr. PR operations must go through the daemon API.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: daemon-bypass

  - id: monitor-no-exec-git
    patterns:
      - pattern: exec.Command("git", ...)
    paths:
      include:
        - /internal/monitor/
      exclude:
        - /internal/monitor/*_test.go
    message: >
      Monitor must not shell out to git. Use daemon API for git operations.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: daemon-bypass

  - id: monitor-no-exec-gh
    patterns:
      - pattern: exec.Command("gh", ...)
    paths:
      include:
        - /internal/monitor/
      exclude:
        - /internal/monitor/*_test.go
    message: >
      Monitor must not shell out to 'gh' CLI. PR/GitHub operations must go
      through the daemon API.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: daemon-bypass

  - id: monitor-no-pr-lookup
    patterns:
      - pattern: pr.LookupInfo(...)
    paths:
      include:
        - /internal/monitor/
      exclude:
        - /internal/monitor/*_test.go
    message: >
      Monitor must not call pr.LookupInfo() directly. PR lookups go through the daemon.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: daemon-bypass

  # ---------------------------------------------------------------------------
  # 5. run.go specific: must be a thin daemon client
  # ---------------------------------------------------------------------------

  - id: run-no-agent-import
    patterns:
      - pattern: |
          import (
            ...
            "github.com/s22625/orch/internal/agent"
            ...
          )
    paths:
      include:
        - /internal/cli/run.go
    message: >
      run.go must not import internal/agent. Agent operations are fully
      delegated to the daemon via StartRun().
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: daemon-bypass

  - id: run-no-multiplexer-import
    patterns:
      - pattern: |
          import (
            ...
            "github.com/s22625/orch/internal/multiplexer"
            ...
          )
    paths:
      include:
        - /internal/cli/run.go
    message: >
      run.go must not import internal/multiplexer. Session creation is
      delegated to the daemon via StartRun().
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: daemon-bypass

  # ---------------------------------------------------------------------------
  # 5b. CLI must not resolve model/variant from config
  #
  # Model and variant resolution (including preset→model/variant, agent-specific
  # defaults like opencode.default_variant, and generic fallbacks) MUST happen in
  # the daemon via config.ResolveModelAndVariant / ResolveControlModelAndVariant.
  # CLI forwards flags/preset name as-is; daemon is the single source of truth.
  # ---------------------------------------------------------------------------

  - id: cli-no-opencode-config-resolution
    patterns:
      - pattern-either:
          - pattern: $CFG.OpenCode.DefaultModel
          - pattern: $CFG.OpenCode.DefaultVariant
    paths:
      include:
        - /internal/cli/
      exclude:
        - /internal/cli/*_test.go
    message: >
      CLI must not read OpenCode-specific config defaults (DefaultModel/DefaultVariant).
      Agent-specific model/variant resolution is handled by the daemon via
      config.ResolveModelAndVariant. CLI should forward flags as-is.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: config-scatter

  - id: cli-no-control-model-inline-resolution
    patterns:
      - pattern-either:
          - pattern: $CFG.ControlModel
          - pattern: $CFG.ControlModelVariant
    paths:
      include:
        - /internal/cli/
      exclude:
        - /internal/cli/*_test.go
    message: >
      CLI must not read ControlModel/ControlModelVariant for inline resolution.
      Use cfg.ResolveControlModelAndVariant(agentType) instead, which applies
      the full fallback chain (control-specific > agent-specific > generic).
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: config-scatter

  - id: cli-no-model-config-fallback
    patterns:
      - pattern-either:
          - pattern: $VAR = $CFG.Model
          - pattern: $VAR = $CFG.ModelVariant
    paths:
      include:
        - /internal/cli/
      exclude:
        - /internal/cli/*_test.go
    message: >
      CLI must not assign model/variant from config for resolution fallback.
      Model and variant resolution (preset > agent-specific > generic) is
      handled by the daemon via config.ResolveModelAndVariant.
      CLI should forward --model/--model-variant flags as-is.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: config-scatter

  # ---------------------------------------------------------------------------
  # 6. Daemon identity/store resolution guardrails
  # ---------------------------------------------------------------------------

  - id: daemon-no-empty-resolve-store-from-proto
    patterns:
      - pattern-either:
          - pattern: resolveStoreFromProto("")
          - pattern: $S.resolveStoreFromProto("")
    paths:
      include:
        - /internal/daemon/
      exclude:
        - /internal/daemon/*_test.go
    message: >
      Daemon must not resolve stores using an empty issues root fallback.
      This can route requests to the wrong project/store.
      Fix: require explicit issues_root and fail closed when missing.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: identity-leakage

  - id: daemon-no-first-store-fallback
    patterns:
      - pattern: |
          for _, $CTX := range $S.repos {
            ...
            if $CTX.Store != nil {
              return $CTX.Store
            }
            ...
          }
    paths:
      include:
        - /internal/daemon/
      exclude:
        - /internal/daemon/*_test.go
    message: >
      Daemon must not return the first store from repos map iteration.
      First-match fallback is non-deterministic and can leak across projects.
      Fix: use explicit identity resolution.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: identity-leakage

  - id: daemon-no-getfirstprojectroot-call
    patterns:
      - pattern-either:
          - pattern: getFirstProjectRoot()
          - pattern: $S.getFirstProjectRoot()
    paths:
      include:
        - /internal/daemon/
      exclude:
        - /internal/daemon/*_test.go
    message: >
      Daemon handlers must not use first project-root fallback from map iteration.
      Fix: require explicit project_root/repo_id identity and fail closed when missing.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: identity-leakage

  - id: daemon-proto-no-legacy-store-resolution-call
    patterns:
      - pattern-either:
          - pattern: resolveStoreFromProto(...)
          - pattern: $S.resolveStoreFromProto(...)
    paths:
      include:
        - /internal/daemon/proto_handler.go
      exclude:
        - /internal/daemon/*_test.go
    message: >
      SPEC-12 cluster invariant: proto runtime handlers must not route stores by
      legacy issues_root/project_root resolution helpers.
      Fix: resolve from RequestContext.project_id (or explicit registered project mapping only).
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: cluster-identity-routing

  - id: daemon-proto-no-issues-root-arg-in-context-resolver
    patterns:
      - pattern: $S.resolveStoreFromContextOrProto($CTX, $REQ.IssuesRoot)
    paths:
      include:
        - /internal/daemon/proto_handler.go
      exclude:
        - /internal/daemon/*_test.go
    message: >
      SPEC-12 cluster invariant: even context-capable resolver calls must not
      carry issues_root as runtime routing input.
      Fix: pass empty fallback and route by RequestContext.project_id only.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: cluster-identity-routing

  - id: daemon-proto-control-launch-no-project-root-fallback
    patterns:
      - pattern-inside: |
          func (s *SocketServer) handleProtoGetControlAgentLaunch(req *orchpb.GetControlAgentLaunchRequest) *orchpb.Response {
            ...
          }
      - pattern-either:
          - pattern: resolveProtoProjectRoot(req.ProjectRoot)
          - pattern: $S.resolveProtoProjectRoot(req.ProjectRoot)
          - pattern: resolveProjectRootFromContextOrProto(req.Context, req.ProjectRoot)
          - pattern: $S.resolveProjectRootFromContextOrProto(req.Context, req.ProjectRoot)
    paths:
      include:
        - /internal/daemon/proto_handler.go
      exclude:
        - /internal/daemon/*_test.go
    message: >
      SPEC-12 cluster invariant: control-agent launch routing must not fall back
      to request project_root. Resolve project identity from RequestContext.project_id only.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: cluster-identity-routing

  - id: daemon-proto-control-config-no-project-root-fallback
    patterns:
      - pattern-inside: |
          func (s *SocketServer) handleProtoGetControlAgentConfig(req *orchpb.GetControlAgentConfigRequest) *orchpb.Response {
            ...
          }
      - pattern-either:
          - pattern: resolveProtoProjectRoot(req.ProjectRoot)
          - pattern: $S.resolveProtoProjectRoot(req.ProjectRoot)
          - pattern: resolveProjectRootFromContextOrProto(req.Context, req.ProjectRoot)
          - pattern: $S.resolveProjectRootFromContextOrProto(req.Context, req.ProjectRoot)
    paths:
      include:
        - /internal/daemon/proto_handler.go
      exclude:
        - /internal/daemon/*_test.go
    message: >
      SPEC-12 cluster invariant: control-agent config routing must not fall back
      to request project_root. Resolve project identity from RequestContext.project_id only.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: cluster-identity-routing

  # ---------------------------------------------------------------------------
  # 7. Transport contract fidelity: prevent Message field overloading
  # ---------------------------------------------------------------------------

  - id: daemon-proto-no-message-overload-model
    patterns:
      - pattern: |
          SendRequest{..., Message: req.Model, ...}
    paths:
      include:
        - /internal/daemon/proto_handler.go
    message: >
      Proto handler must not overload SendRequest.Message with req.Model.
      Use the dedicated SendRequest.Model field instead.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: field-overload

  - id: daemon-proto-no-message-overload-tmux
    patterns:
      - pattern: |
          SendRequest{..., Message: req.SessionName, ...}
    paths:
      include:
        - /internal/daemon/proto_handler.go
    message: >
      Proto handler must not overload SendRequest.Message with req.SessionName.
      Use the dedicated SendRequest.SessionName field instead.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: field-overload

  - id: daemon-socket-no-message-model-consumption
    patterns:
      - pattern: |
          metadata["model"] = req.Message
    paths:
      include:
        - /internal/daemon/socket.go
    message: >
      Do not read model from req.Message. Use req.Model instead.
      The Message field was previously overloaded for model; use the dedicated field.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: field-overload

  - id: daemon-socket-no-message-tmux-consumption
    patterns:
      - pattern: |
          $SESSION := req.Message
    paths:
      include:
        - /internal/daemon/socket.go
      exclude:
        - /internal/daemon/*_test.go
    message: >
      Do not read session name from req.Message. Use req.SessionName instead.
      The Message field was previously overloaded for tmux session; use the dedicated field.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: field-overload

  # ---------------------------------------------------------------------------
  # 8. Identity collision guardrails: prevent bare basename fallbacks
  # ---------------------------------------------------------------------------

  - id: daemon-no-repoid-basename-fallback
    patterns:
      - pattern: return filepath.Base($X), nil
    paths:
      include:
        - /internal/xdg/paths.go
        - /internal/daemon/socket.go
      exclude:
        - "*_test.go"
    message: >
      Do not return bare filepath.Base() as a repo ID.
      Bare basenames cause collisions when repos share the same directory name.
      Fix: suffix with a path-derived hash, e.g. fmt.Sprintf("%s-%x", filepath.Base(x), sha256(x)[:4]).
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: identity-collision

  - id: daemon-no-implicit-repoid-fallback
    patterns:
      - pattern: $ID = filepath.Base($PATH)
    paths:
      include:
        - /internal/xdg/paths.go
        - /internal/daemon/socket.go
      exclude:
        - "*_test.go"
    message: >
      Do not assign filepath.Base() directly as a repo ID fallback.
      Bare basenames cause collisions when repos share the same directory name.
      Fix: use a hash-suffixed or hash-only derivation.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: identity-collision

  # ---------------------------------------------------------------------------
  # 9. Incremental migration guardrails (prevent boundary debt expansion)
  # ---------------------------------------------------------------------------

  - id: monitor-no-daemon-import-incremental
    patterns:
      - pattern: |
          import (
            ...
            "github.com/s22625/orch/internal/daemon"
            ...
          )
    paths:
      include:
        - /internal/monitor/
      exclude:
        - /internal/monitor/*_test.go
    message: >
      Monitor should not import internal/daemon directly. Use orchapi as the
      boundary and move daemon lifecycle/health operations behind API methods.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: abstraction-bypass

  - id: monitor-no-store-import-incremental
    patterns:
      - pattern: |
          import (
            ...
            "github.com/s22625/orch/internal/store"
            ...
          )
    paths:
      include:
        - /internal/monitor/
      exclude:
        - /internal/monitor/*_test.go
    message: >
      Monitor should not import internal/store directly. Store access must be
      daemon-owned and exposed via orchapi.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: daemon-bypass

  - id: cli-no-worktree-fs-check-incremental
    patterns:
      - pattern-either:
          - pattern: os.Stat($PATH)
          - pattern: os.Lstat($PATH)
      - metavariable-regex:
          metavariable: $PATH
          regex: .*[Ww]orktree.*
    paths:
      include:
        - /internal/cli/
      exclude:
        - /internal/cli/*_test.go
    message: >
      CLI must not perform direct worktree filesystem checks. Use daemon-returned
      run metadata (worktree_exists/branch_state) via orchapi.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: daemon-bypass

  - id: daemon-proto-no-new-jsoncapture-bridge
    patterns:
      - pattern: json.Unmarshal($BUF.data, &$RESULT)
    paths:
      include:
        - /internal/daemon/proto_handler.go
      exclude:
        - /internal/daemon/*_test.go
    message: >
      Do not add new proto->JSON capture bridges in proto handlers. Route
      through shared typed service methods instead of jsonCapture bridges.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: transport-drift

  # ---------------------------------------------------------------------------
  # 10. Exec boundaries and legacy tmux guardrails
  # ---------------------------------------------------------------------------

  - id: no-legacy-tmux-import
    patterns:
      - pattern: |
          import (
            ...
            "github.com/s22625/orch/internal/tmux"
            ...
          )
    paths:
      include:
        - /internal/
      exclude:
        - "*_test.go"
    message: >
      Use internal/multiplexer.Multiplexer interface instead of legacy internal/tmux package.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: boundary-enforcement

  - id: no-raw-exec-in-boundary-layers
    patterns:
      - pattern-either:
          - pattern: exec.Command(...)
          - pattern: exec.CommandContext(...)
    paths:
      include:
        - /internal/daemon/
        - /internal/cli/
        - /internal/monitor/
      exclude:
        # Daemon-managed process lifecycle exceptions
        - /internal/daemon/daemon.go
        - /internal/daemon/socket.go
        # CLI UX/runtime exceptions
        - /internal/cli/exec.go
        - /internal/cli/log.go
        - /internal/cli/open.go
        - /internal/cli/attach.go
        - /internal/cli/agent.go
        - /internal/cli/diff.go
        # Monitor UI launcher exceptions
        - /internal/monitor/dashboard.go
        - /internal/monitor/issues_dashboard.go
        - /internal/monitor/monitor.go
        - "*_test.go"
    message: >
      Raw exec.Command/exec.CommandContext in daemon/cli/monitor layers.
      Use the appropriate interface: git.Runner, github.Client, ProcessManager,
      multiplexer.Multiplexer, orchapi.OrchAPI, or agent.Adapter.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: boundary-enforcement

  - id: no-raw-unix-socket-dial
    patterns:
      - pattern-either:
          - pattern: net.DialTimeout("unix", ...)
          - pattern: net.Dial("unix", ...)
    paths:
      include:
        - /internal/cli/
        - /internal/monitor/
        - /internal/orchapi/
        - /internal/daemon/
      exclude:
        - /internal/daemon/proto_client.go
        - /internal/daemon/startup_recovery.go
        - /internal/daemon/*_test.go
        - /internal/cli/*_test.go
        - /internal/monitor/*_test.go
        - /internal/orchapi/*_test.go
    message: >
      CRITICAL (orch-447): do not create raw Unix socket connections in client
      request paths. Route daemon communication through ProtoClient's
      persistent connection manager to prevent socket churn regressions.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: socket-churn

  - id: no-oneshot-health-probe-socket
    patterns:
      - pattern: |
          (defn _probe-daemon-health ...)
    paths:
      include:
        - /orch-monitor-tui/orch_monitor/proto_client.hy
    message: >
      CRITICAL (orch-447): avoid one-shot daemon health probe sockets in the
      Python/Hy monitor. Availability checks must use the persistent
      ProtoDaemonClient channel.
    severity: ERROR
    languages: [generic]
    metadata:
      category: architecture
      violation: socket-churn

  # ---------------------------------------------------------------------------
  # 11. PR cache enforcement: daemon must use cached/batched PR lookups
  #
  # The daemon MUST NOT call uncached PR lookup functions directly.
  # These functions shell out to `gh` CLI on every call with no caching,
  # which exhausts the GitHub API rate limit (5000/hr) with just ~4 active runs.
  #
  # Allowed: pr.PopulateRunInfo() / pr.PopulateRunInfoWithClient() — batched + cached
  # Banned:  pr.LookupInfo() / pr.LookupInfoByURL() / pr.LookupInfoWithClient()
  #
  # Tracked by: orch-450
  # ---------------------------------------------------------------------------

  - id: daemon-no-uncached-pr-lookup
    patterns:
      - pattern-either:
          - pattern: pr.LookupInfo(...)
          - pattern: pr.LookupInfoWithClient(...)
    paths:
      include:
        - /internal/daemon/
      exclude:
        - /internal/daemon/*_test.go
    message: >
      Daemon must not call pr.LookupInfo() or pr.LookupInfoWithClient() directly.
      These bypass the PR cache and shell out to `gh pr list` on every call,
      exhausting the GitHub API rate limit (5000/hr).
      Fix: Use pr.PopulateRunInfo() or pr.PopulateRunInfoWithClient() which
      batch lookups and respect cache TTLs (cacheHitTTL, cacheMissTTL, cacheMaxFetches).
      See: orch-450
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: rate-limit-bypass

  - id: daemon-no-uncached-pr-lookup-by-url
    patterns:
      - pattern: pr.LookupInfoByURL(...)
    paths:
      include:
        - /internal/daemon/
      exclude:
        - /internal/daemon/*_test.go
    message: >
      Daemon must not call pr.LookupInfoByURL() directly.
      This bypasses the PR cache and shells out to `gh pr view` on every call,
      exhausting the GitHub API rate limit (5000/hr).
      Fix: Use a cache-aware lookup that respects TTLs, or batch via PopulateRunInfo.
      See: orch-450
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: rate-limit-bypass

  # ---------------------------------------------------------------------------
  # 12. Control-agent split guardrails (remote-safe monitor architecture)
  # ---------------------------------------------------------------------------

  - id: monitor-no-control-agent-launch-rpc
    patterns:
      - pattern: $API.GetControlAgentLaunch(...)
    paths:
      include:
        - /internal/monitor/
      exclude:
        - /internal/monitor/*_test.go
    message: >
      Monitor must not call GetControlAgentLaunch() directly.
      For remote-safe architecture, monitor should use GetControlAgentConfig()
      and manage local control-agent session lifecycle client-side.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      violation: control-agent-split
