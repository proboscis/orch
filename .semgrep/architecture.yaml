rules:
  - id: cli-no-store-import
    patterns:
      - pattern: |
          import (
            ...
            "github.com/s22625/orch/internal/store"
            ...
          )
    paths:
      include:
        - /internal/cli/*.go
    message: |
      CLI commands should not import internal/store directly.
      Use getAPI() to access data through the daemon instead.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      issue: orch-374

  - id: cli-no-store-file-import
    patterns:
      - pattern: |
          import (
            ...
            "github.com/s22625/orch/internal/store/file"
            ...
          )
    paths:
      include:
        - /internal/cli/*.go
    message: |
      CLI commands should not import internal/store/file directly.
      Use getAPI() to access data through the daemon instead.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      issue: orch-374

  - id: cli-no-file-open
    patterns:
      - pattern-either:
          - pattern: os.Open(...)
          - pattern: os.OpenFile(...)
          - pattern: os.Create(...)
    paths:
      include:
        - /internal/cli/*.go
    message: |
      CLI commands should not use os.Open/OpenFile/Create directly.
      File operations should go through the daemon API.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture

  - id: cli-no-file-readwrite
    patterns:
      - pattern-either:
          - pattern: os.ReadFile(...)
          - pattern: os.WriteFile(...)
          - pattern: ioutil.ReadFile(...)
          - pattern: ioutil.WriteFile(...)
    paths:
      include:
        - /internal/cli/*.go
    message: |
      CLI commands should not use os.ReadFile/WriteFile directly.
      File operations should go through the daemon API.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture

  - id: cli-no-opencode-client
    patterns:
      - pattern: agent.NewOpenCodeClient(...)
    paths:
      include:
        - /internal/cli/*.go
    message: |
      CLI must not create OpenCodeClient directly.
      All opencode server interactions must go through the daemon.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      issue: orch-405

  - id: cli-no-agent-manager-sendmessage
    patterns:
      - pattern: $MANAGER.SendMessage(...)
      - metavariable-pattern:
          metavariable: $MANAGER
          pattern-either:
            - pattern: agent.GetManager(...)
            - pattern: $M
    paths:
      include:
        - /internal/cli/*.go
    message: |
      CLI must not call AgentManager.SendMessage directly.
      Use daemon.SendViaDaemon() for all agent message sending.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      issue: orch-405

  - id: cli-no-multiplexer-direct
    patterns:
      - pattern-either:
          - pattern: multiplexer.GetDefault()
          - pattern: multiplexer.SendKeys(...)
          - pattern: $MUX.SendKeys(...)
          - pattern: $MUX.SendKeysLiteral(...)
    paths:
      include:
        - /internal/cli/*.go
    message: |
      CLI must not interact with multiplexer directly.
      All tmux/agent interactions must go through the daemon.
    severity: ERROR
    languages: [go]
    metadata:
      category: architecture
      issue: orch-405
