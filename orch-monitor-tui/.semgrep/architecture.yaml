rules:
  # =============================================================================
  # Python TUI Architecture Rules
  # =============================================================================
  # These rules enforce that TUI components use the OrchAPI interface instead of
  # direct file I/O for accessing issue/run data. Config and launcher code are
  # excluded as they handle local configuration, not issue/run data.
  #
  # Run with: make lint (or: semgrep --config .semgrep/architecture.yaml orch_monitor/)

  - id: tui-no-direct-file-read
    patterns:
      - pattern-either:
          - pattern: open($PATH, ...)
          - pattern: open($PATH)
          - pattern: $X.read_text(...)
          - pattern: $X.read_bytes(...)
          - pattern: Path($PATH).read_text(...)
          - pattern: Path($PATH).read_bytes(...)
    paths:
      include:
        - "*.py"
      exclude:
        - "__main__.py"      # Launcher - handles layout generation
        - "config.py"        # Config - legitimate local TUI config
        - "proto_client.py"  # Low-level client (if exists)
    message: |
      TUI components should not read files directly.
      Use OrchAPI methods (e.g., api.get_issue(), api.get_run()) instead.
      
      Direct file I/O bypasses the daemon and breaks the architecture.
    severity: ERROR
    languages: [python]
    metadata:
      category: architecture
      layer: tui

  - id: tui-no-direct-file-write
    patterns:
      - pattern-either:
          - pattern: open($PATH, "w", ...)
          - pattern: open($PATH, "w")
          - pattern: open($PATH, "a", ...)
          - pattern: open($PATH, "a")
          - pattern: $X.write_text(...)
          - pattern: $X.write_bytes(...)
          - pattern: Path($PATH).write_text(...)
          - pattern: Path($PATH).write_bytes(...)
    paths:
      include:
        - "*.py"
      exclude:
        - "__main__.py"  # Launcher - handles layout generation
        - "config.py"    # Config - legitimate local TUI config
    message: |
      TUI components should not write files directly.
      Use OrchAPI methods (e.g., api.create_issue(), api.stop_run()) instead.
      
      Direct file I/O bypasses the daemon and breaks the architecture.
    severity: ERROR
    languages: [python]
    metadata:
      category: architecture
      layer: tui

  - id: tui-no-os-file-operations
    patterns:
      - pattern-either:
          - pattern: os.open(...)
          - pattern: os.read(...)
          - pattern: os.write(...)
          - pattern: os.remove(...)
          - pattern: os.unlink(...)
          - pattern: os.rename(...)
          - pattern: os.makedirs(...)
          - pattern: os.mkdir(...)
    paths:
      include:
        - "*.py"
      exclude:
        - "__main__.py"
        - "config.py"
    message: |
      TUI components should not use os module for file operations.
      Use OrchAPI methods to access data through the daemon instead.
    severity: ERROR
    languages: [python]
    metadata:
      category: architecture
      layer: tui

  - id: tui-no-shutil-operations
    patterns:
      - pattern-either:
          - pattern: shutil.copy(...)
          - pattern: shutil.copy2(...)
          - pattern: shutil.move(...)
          - pattern: shutil.rmtree(...)
          - pattern: shutil.copytree(...)
    paths:
      include:
        - "*.py"
      exclude:
        - "__main__.py"
        - "config.py"
    message: |
      TUI components should not use shutil for file operations.
      Use OrchAPI methods to access data through the daemon instead.
    severity: ERROR
    languages: [python]
    metadata:
      category: architecture
      layer: tui

  # =============================================================================
  # Hy TUI Architecture Rules (using generic patterns)
  # =============================================================================
  # Hy is a Lisp that compiles to Python. These rules use generic pattern
  # matching to catch direct file I/O in Hy source files.

  - id: hy-tui-no-direct-file-read
    patterns:
      - pattern-regex: '\(\.read-text\s+'
      - pattern-regex: '\(\.read-bytes\s+'
      - pattern-regex: '\(with\s+\[\s*\w+\s+\(open\s+'
    paths:
      include:
        - "*.hy"
      exclude:
        - "proto_client.hy"  # Low-level daemon client
    message: |
      Hy TUI components should not read files directly.
      Use OrchAPI methods instead of (.read-text ...) or (open ...).
    severity: ERROR
    languages: [generic]
    metadata:
      category: architecture
      layer: tui

  - id: hy-tui-no-direct-file-write
    patterns:
      - pattern-regex: '\(\.write-text\s+'
      - pattern-regex: '\(\.write-bytes\s+'
      - pattern-regex: '\(\.write\s+\w+\s+"'
    paths:
      include:
        - "*.hy"
      exclude:
        - "proto_client.hy"
    message: |
      Hy TUI components should not write files directly.
      Use OrchAPI methods instead of (.write-text ...) or (.write ...).
    severity: ERROR
    languages: [generic]
    metadata:
      category: architecture
      layer: tui

  # =============================================================================
  # Textual Message Handler Safety Rules
  # =============================================================================
  # Message handlers (on_* methods) that call .dismiss() directly cause
  # "Can't await screen.dismiss() from message handler" errors.
  # Use defon macro with safe-dismiss instead.

  - id: hy-use-defon-for-message-handlers
    patterns:
      - pattern-regex: '\(defn\s+on_(button_pressed|key|click|input_changed|selection_changed)\s+\[self'
    paths:
      include:
        - "*.hy"
      exclude:
        - "macros.hy"
    message: |
      Use (defon ...) macro instead of (defn on_*) for Textual message handlers.
      
      Message handlers that call .dismiss() directly cause ScreenError.
      The defon macro enforces safe-dismiss usage at compile time.
      
      Change: (defn on_button_pressed [self event] ...)
      To:     (defon (Button.Pressed) handler [self event] ...)
    severity: ERROR
    languages: [generic]
    metadata:
      category: safety
      layer: tui

  - id: hy-no-raw-dismiss
    patterns:
      - pattern-regex: '\(\.dismiss\s+self'
    paths:
      include:
        - "*.hy"
      exclude:
        - "macros.hy"
    message: |
      Use (safe-dismiss self result) instead of (.dismiss self result).
      
      Raw .dismiss calls can cause "Can't await screen.dismiss() from message
      handler" errors. safe-dismiss uses call_later to defer the dismiss.
    severity: ERROR
    languages: [generic]
    metadata:
      category: safety
      layer: tui

  # =============================================================================
  # Import Rules - Prevent bypassing OrchAPI
  # =============================================================================

  - id: tui-no-models-file-import
    patterns:
      - pattern: from .models import $X
    paths:
      include:
        - "runs_dashboard.hy"
        - "issues_dashboard.hy"
        - "orch_monitor_app.hy"
    message: |
      Dashboard components should use orch_api types, not models directly.
      Import from .orch_api instead of .models for data types.
      
      The models module is for internal use by daemon_api.py.
    severity: WARNING
    languages: [python]
    metadata:
      category: architecture
      layer: tui

  # =============================================================================
  # Control-Agent Split Guardrail (remote-safe monitor architecture)
  # =============================================================================

  - id: tui-launcher-no-control-agent-launch-rpc
    patterns:
      - pattern: $DAEMON.get_control_agent_launch(...)
    paths:
      include:
        - "__main__.py"
    message: |
      Launcher must not call get_control_agent_launch().
      Use get_control_agent_config() and build control-agent command/session
      locally to preserve remote-safe control-agent split.
    severity: ERROR
    languages: [python]
    metadata:
      category: architecture
      layer: tui
      violation: control-agent-split

  # =============================================================================
  # Client/Protocol Single Source of Truth Guardrails
  # =============================================================================
  # The Go daemon/client bootstrap owns repo identity, remote routing, protocol
  # display normalization, monitor session-name generation, sorting, and filtering.
  # The TUI may request those values and render them, but must not re-derive them.

  - id: tui-no-git-subprocess
    patterns:
      - pattern-regex: "subprocess\\.(run|Popen|check_output|check_call)\\s*\\(\\s*\\[\\s*[\"'](?:[^\"']*/)?git[\"']|\\(\\s*subprocess\\.(run|Popen|check-output|check-call)\\s+\\[\\s*[\"'](?:[^\"']*/)?git[\"']|subprocess\\.(run|Popen|check_output|check_call)\\s*\\(\\s*[\"'](?:[^\"']*[\\s;&|])?(?:[^\"']*/)?git(?:\\s|[\"'])|(?:cmd|command|args|argv)\\s*=\\s*\\[\\s*[\"'](?:[^\"']*/)?git[\"'][\\s\\S]{0,300}?subprocess\\.(run|Popen|check_output|check_call)\\s*\\(\\s*(?:cmd|command|args|argv)\\b"
    paths:
      include:
        - "*.py"
        - "*.hy"
      exclude:
        - "**/api/*"
    message: |
      TUI must not shell out to git. Git/repo state belongs to the Go daemon.
      Request daemon/bootstrap data instead.
    severity: ERROR
    languages: [generic]
    metadata:
      category: architecture
      layer: tui
      violation: client-logic-ssot

  - id: tui-no-local-repo-id-parsing
    patterns:
      - pattern-regex: "_parse_repo_id_from_url|repo_id_from_project|resolve_project_identity|remote\\.origin\\.url|git\\s+config\\s+--get\\s+remote\\.origin\\.url"
    paths:
      include:
        - "*.py"
        - "*.hy"
      exclude:
        - "**/api/*"
    message: |
      TUI must not parse repo IDs or git remote URLs locally.
      Use the Go-resolved client bootstrap project_id.
    severity: ERROR
    languages: [generic]
    metadata:
      category: architecture
      layer: tui
      violation: client-logic-ssot

  - id: tui-no-remote-addr-resolution
    patterns:
      - pattern-regex: "resolve_remote_addr|_resolve_remote_alias|remote_hosts|remote\\.hosts|_load_client_config"
    paths:
      include:
        - "*.py"
        - "*.hy"
      exclude:
        - "**/api/*"
    message: |
      TUI must not resolve remote daemon addresses locally.
      Use the Go-resolved client bootstrap remote_addr.
    severity: ERROR
    languages: [generic]
    metadata:
      category: architecture
      layer: tui
      violation: client-logic-ssot

  - id: tui-no-proto-status-remap
    patterns:
      - pattern-regex: "model-status->proto|proto-status->model|model-issue-status->proto|proto-issue-status->model|api_run_status_to_proto|api_issue_status_to_proto|RUN_STATUS_|ISSUE_STATUS_|\\bApiRunStatus\\b|\\bApiIssueStatus\\b"
    paths:
      include:
        - "*.py"
        - "*.hy"
      exclude:
        - "**/api/*"
    message: |
      TUI must not map protobuf status enums locally.
      The daemon sends display status strings; the TUI only renders those values.
    severity: ERROR
    languages: [generic]
    metadata:
      category: architecture
      layer: tui
      violation: client-logic-ssot

  - id: tui-no-proto-branch-mux-remap
    patterns:
      - pattern-regex: "proto-branch-state->str|proto-multiplexer->str|BRANCH_STATE_|MULTIPLEXER_"
    paths:
      include:
        - "*.py"
        - "*.hy"
      exclude:
        - "**/api/*"
    message: |
      TUI must not map protobuf branch-state or multiplexer enums locally.
      The daemon sends display strings for branch state and multiplexer names.
    severity: ERROR
    languages: [generic]
    metadata:
      category: architecture
      layer: tui
      violation: client-logic-ssot

  - id: tui-no-client-monitor-session-name-generation
    patterns:
      - pattern-regex: "SESSION_NAME_PREFIX|_SESSION_HASH_LEN|_SESSION_NAME_SAFETY|_max_session_name_len|def\\s+get_session_name\\s*\\(|def\\s+\\w*(?:session|monitor)\\w*\\s*\\([^)]*\\)\\s*:[\\s\\S]{0,500}?hashlib\\.(?:md5|sha1|sha224|sha256|sha384|sha512|blake2b|blake2s)|orch-monitor[^\\n]*hashlib\\.(?:md5|sha1|sha224|sha256|sha384|sha512|blake2b|blake2s)|hashlib\\.(?:md5|sha1|sha224|sha256|sha384|sha512|blake2b|blake2s)[^\\n]*orch-monitor"
    paths:
      include:
        - "*.py"
        - "*.hy"
      exclude:
        - "**/api/*"
    message: |
      TUI must not generate monitor multiplexer session names locally.
      Use the Go-resolved client bootstrap monitor_session_name.
    severity: ERROR
    languages: [generic]
    metadata:
      category: architecture
      layer: tui
      violation: client-logic-ssot

  - id: tui-no-client-side-run-sort
    patterns:
      - pattern-regex: "sorted\\s*\\(\\s*(runs|issues)\\b|\\b(runs|issues)\\.sort\\s*\\(|\\.sort\\s+(runs|issues)\\b"
    paths:
      include:
        - "*.py"
        - "*.hy"
      exclude:
        - "**/api/*"
    message: |
      TUI must not sort daemon data client-side.
      Sorting belongs to the daemon so every client sees the same order.
    severity: ERROR
    languages: [generic]
    metadata:
      category: architecture
      layer: tui
      violation: client-logic-ssot

  - id: tui-no-client-side-filtering
    patterns:
      - pattern-regex: "filter_runs_client_side|filter_issues_client_side|\\[[^\\]]+\\s+for\\s+\\w+\\s+in\\s+(runs|issues)\\s+if\\s+[^\\]]+\\]|for\\s+\\w+\\s+in\\s+(runs|issues)\\s*:[\\s\\S]{0,200}?if\\s+[^\\n:]+:[\\s\\S]{0,200}?\\.append\\s*\\(|:if\\s+\\(in\\s+[^\\)]*\\.agent"
    paths:
      include:
        - "*.py"
        - "*.hy"
      exclude:
        - "**/api/*"
    message: |
      TUI must not filter daemon runs/issues client-side.
      Send status/agent/text filters to the daemon API.
    severity: ERROR
    languages: [generic]
    metadata:
      category: architecture
      layer: tui
      violation: client-logic-ssot

  - id: tui-no-bare-except
    patterns:
      - pattern: |
          try:
            ...
          except:
            ...
    paths:
      include:
        - "*.py"
      exclude:
        - "**/api/*"
    message: |
      Do not use bare except in TUI code. Catch a concrete exception type.
    severity: ERROR
    languages: [python]
    metadata:
      category: safety
      layer: tui
      violation: silent-failure

  - id: hy-tui-no-bare-except
    patterns:
      - pattern-regex: "\\(except\\s+\\[\\s*\\]"
    paths:
      include:
        - "*.hy"
      exclude:
        - "**/api/*"
    message: |
      Do not use bare except in Hy TUI code. Catch a concrete exception type.
    severity: ERROR
    languages: [generic]
    metadata:
      category: safety
      layer: tui
      violation: silent-failure
