[project]
name = "orch-monitor"
version = "0.2.0"
description = "Python Textual-based TUI for orch monitor (daemon-only architecture)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.47.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
]

[project.scripts]
orch-monitor = "orch_monitor.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
