[project]
name = "orch-monitor"
version = "0.2.0"
description = "Python Textual-based TUI for orch monitor (daemon-only architecture)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.47.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "returns>=0.23.0",
    "protobuf>=5.27.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-textual-snapshot>=1.0.0",
]

[project.scripts]
orch-monitor = "orch_monitor.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
