[package]
name = "orch_vault_rs"
version = "0.1.0"
edition = "2021"
description = "Rust backend for orch vault reading via PyO3"

[lib]
name = "orch_vault_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
walkdir = "2.4"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
