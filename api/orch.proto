syntax = "proto3";

package orch.v1;

option go_package = "github.com/s22625/orch/api/orchpb";

// =============================================================================
// Enums
// =============================================================================

enum RunStatus {
  RUN_STATUS_UNSPECIFIED = 0;
  RUN_STATUS_QUEUED = 1;
  RUN_STATUS_BOOTING = 2;
  RUN_STATUS_RUNNING = 3;
  RUN_STATUS_WAITING = 4;
  RUN_STATUS_RATE_LIMITED = 5;
  RUN_STATUS_PR_OPEN = 6;
  RUN_STATUS_DONE = 7;
  RUN_STATUS_FAILED = 8;
  RUN_STATUS_CANCELED = 9;
}

enum IssueStatus {
  ISSUE_STATUS_UNSPECIFIED = 0;
  ISSUE_STATUS_OPEN = 1;
  ISSUE_STATUS_RESOLVED = 2;
  ISSUE_STATUS_CLOSED = 3;
}

enum BranchState {
  BRANCH_STATE_UNSPECIFIED = 0;
  BRANCH_STATE_CLEAN = 1;
  BRANCH_STATE_DIRTY = 2;
  BRANCH_STATE_MERGED = 3;
  BRANCH_STATE_CONFLICT = 4;
  BRANCH_STATE_AHEAD = 5;
  BRANCH_STATE_BEHIND = 6;
  BRANCH_STATE_DIVERGED = 7;
  BRANCH_STATE_SYNCED = 8;
}

enum Multiplexer {
  MULTIPLEXER_UNSPECIFIED = 0;
  MULTIPLEXER_TMUX = 1;
  MULTIPLEXER_ZELLIJ = 2;
}

// =============================================================================
// Domain Models
// =============================================================================

message DiffStats {
  int32 additions = 1;
  int32 deletions = 2;
  int32 files_changed = 3;
  repeated string files = 4;
}

message Run {
  string issue_id = 1;
  string run_id = 2;
  RunStatus status = 3;
  string agent = 4;
  string model = 5;
  string branch = 6;
  string worktree_path = 7;
  string pr_url = 8;
  int64 started_at_unix = 9;
  int64 updated_at_unix = 10;
  int32 elapsed_seconds = 11;
  string elapsed_display = 12;
  DiffStats diff_stats = 13;
  BranchState branch_state = 14;
  string session_name = 15;
  Multiplexer multiplexer = 16;
  int32 server_port = 17;
  string opencode_session_id = 18;
  string continued_from = 19;
  int32 pr_number = 20;
  string pr_state = 21;
  string issue_status = 22;
  string issue_topic = 23;
  bool alive = 24;
  bool alive_known = 25;
  bool worktree_exists = 26;
  string target = 27;
  string target_host = 28;
}

message Issue {
  string id = 1;
  string title = 2;
  string summary = 3;
  IssueStatus status = 4;
  repeated string tags = 5;
  string body = 6;
  string path = 7;
  int64 modified_at_unix = 8;
  string topic = 9;
}

message Event {
  int64 timestamp_unix = 1;
  string type = 2;
  string name = 3;
  map<string, string> attrs = 4;
}

// =============================================================================
// Requests & Responses
// =============================================================================

// --- Lifecycle ---

message PingRequest {}
message PingResponse {
  bool ok = 1;
  string version = 2;
}

message RequestContext {
  string project_id = 1;
  string request_id = 2;
  string client_id = 3;
}

// --- Runs ---

message ListRunsRequest {
  string issue_id = 2;
  repeated RunStatus status = 3;
  string agent = 4;
  string text_search = 5;
  string time_range = 6;  // "hour", "today", "week"
  int32 limit = 7;
  string cursor = 8;
  string older_than = 9;  // ISO8601 timestamp - filter runs older than this time
  RequestContext context = 10;
}

message ListRunsResponse {
  repeated Run runs = 1;
  int32 total = 2;
  string next_cursor = 3;
}

message GetRunRequest {
  string issue_id = 2;
  string run_id = 3;
  RequestContext context = 4;
}

message GetRunResponse {
  Run run = 1;
  repeated Event events = 2;
}

message StartRunRequest {
  string issue_id = 2;
  string agent = 3;
  string model = 4;
  string model_variant = 5;
  string base_branch = 6;
  string preset = 8;
  string branch = 9;
  string worktree_dir = 10;
  bool no_pr = 11;
  string prompt_template = 12;
  string pr_target_branch = 13;
  bool dry_run = 14;
  bool reuse = 15;
  string run_id = 16;
  string agent_cmd = 17;
  string agent_profile = 18;
  string multiplexer = 19;
  string target = 20;
  RequestContext context = 21;
}

message StartRunResponse {
  string run_id = 1;
  string branch = 2;
  string worktree_path = 3;
  string session_name = 4;
  string status = 5;
}

message CreateRunRequest {
  string issue_id = 2;
  string run_id = 3;
  map<string, string> metadata = 4;
  RequestContext context = 5;
}

message CreateRunResponse {
  string issue_id = 1;
  string run_id = 2;
  string path = 3;
}

message StopRunRequest {
  string issue_id = 2;
  string run_id = 3;
  RequestContext context = 4;
}

message StopRunResponse {}

message ResolveRunRequest {
  string issue_id = 2;
  string run_id = 3;
  RequestContext context = 4;
}

message ResolveRunResponse {}

message WaitForStatusRequest {
  string issue_id = 2;
  string run_id = 3;
  string short_id = 4;
  RunStatus until = 5;
  int32 timeout_seconds = 6;
  RequestContext context = 7;
}

message WaitForStatusResponse {
  Run run = 1;
  repeated Event events = 2;
}

// --- Issues ---

message ListIssuesRequest {
  repeated IssueStatus status = 2;
  repeated string tags = 3;
  string tags_mode = 4;  // "and" or "or"
  string text_search = 5;
  int32 limit = 6;
  string cursor = 7;
  RequestContext context = 8;
}

message ListIssuesResponse {
  repeated Issue issues = 1;
  int32 total = 2;
  string next_cursor = 3;
}

message GetIssueRequest {
  string issue_id = 2;
  RequestContext context = 3;
}

message GetIssueResponse {
  Issue issue = 1;
}

message CreateIssueRequest {
  string issue_id = 2;
  string title = 3;
  string body = 4;
  repeated string tags = 5;
  RequestContext context = 6;
}

message CreateIssueResponse {
  string path = 1;
}

message CloseIssueRequest {
  string issue_id = 2;
  RequestContext context = 3;
}

message CloseIssueResponse {}

// --- Control Agent ---

message GetControlAgentLaunchRequest {
  string agent = 2;
  bool new_session = 3;
  RequestContext context = 4;
}

message GetControlAgentLaunchResponse {
  string command = 1;
  string prompt_file = 2;
  int32 port = 3;
  string session_id = 4;
  bool resumed = 5;
}

message GetControlAgentConfigRequest {
  RequestContext context = 2;
}

message GetControlAgentConfigResponse {
  string prompt_content = 1;
  string agent = 2;
  string model = 3;
  string model_variant = 4;
  repeated string extra_args = 5;
}

// --- Session Operations ---

message GetAttachInfoRequest {
  string issue_id = 2;
  string run_id = 3;
  string short_id = 4;
  RequestContext context = 5;
}

message GetAttachInfoResponse {
  repeated string command = 1;
  Multiplexer multiplexer = 2;
  string session_name = 3;
  string worktree_path = 4;
  string agent = 5;
  int32 server_port = 6;
  string opencode_session_id = 7;
  string issue_id = 8;
  string run_id = 9;
  string target_host = 10;
}

message CaptureSessionRequest {
  string issue_id = 2;
  string run_id = 3;
  RequestContext context = 4;
  int32 lines = 5;
}

message CaptureSessionResponse {
  string content = 1;
  int64 timestamp_unix = 2;
  string source = 3;
}

message SendMessageRequest {
  string issue_id = 2;
  string run_id = 3;
  string message = 4;
  RequestContext context = 5;
  bool no_enter = 6;
}

message SendMessageResponse {}

// --- Git Operations ---

message GetDiffStatsRequest {
  string issue_id = 2;
  string run_id = 3;
  RequestContext context = 4;
}

message GetDiffStatsResponse {
  DiffStats diff_stats = 1;
}

message GetBranchStateRequest {
  string issue_id = 2;
  string run_id = 3;
  RequestContext context = 4;
}

message GetBranchStateResponse {
  BranchState state = 1;
}

message GetDiffRequest {
  string issue_id = 2;
  string run_id = 3;
  RequestContext context = 4;
}

message GetDiffResponse {
  string diff = 1;
}

// --- Monitor Registration ---

message RegisterMonitorRequest {
  int32 pid = 1;
  string monitor_type = 2;
  string view = 3;
  string project = 4;
  string session_name = 5;
}

message RegisterMonitorResponse {
  string monitor_id = 1;
}

message UnregisterMonitorRequest {
  string monitor_id = 1;
}

message UnregisterMonitorResponse {}

message HeartbeatRequest {
  string monitor_id = 1;
}

message HeartbeatResponse {}

message ListMonitorsRequest {
  string project = 1;
  bool all = 2;
}

message MonitorInfo {
  string id = 1;
  int32 pid = 2;
  string type = 3;
  string view = 4;
  string project = 5;
  string session_name = 6;
  int64 started_at_unix = 7;
  int64 last_heartbeat_unix = 8;
}

message ListMonitorsResponse {
  repeated MonitorInfo monitors = 1;
}

message KillMonitorRequest {
  string monitor_id = 1;
  bool all = 2;
  bool global = 3;
  string project = 4;
}

message KillMonitorResponse {
  int32 killed_count = 1;
}

// --- Worker Plane Protocol ---

message RegisterWorkerRequest {
  string worker_id = 1;
  string worker_type = 2;
  string host = 3;
  string mode = 4;
  string auth_token = 5;
  repeated string capabilities = 6;
}

message RegisterWorkerResponse {
  string worker_id = 1;
  int64 heartbeat_ttl_seconds = 2;
}

message UnregisterWorkerRequest {
  string worker_id = 1;
}

message UnregisterWorkerResponse {}

message WorkerHeartbeatRequest {
  string worker_id = 1;
  string auth_token = 2;
}

message WorkerHeartbeatResponse {
  int64 heartbeat_ttl_seconds = 1;
}

message ListWorkersRequest {}

message WorkerInfo {
  string id = 1;
  string worker_type = 2;
  string host = 3;
  string mode = 4;
  int64 registered_at_unix = 5;
  int64 last_heartbeat_unix = 6;
  bool active = 7;
  repeated string capabilities = 8;
}

message ListWorkersResponse {
  repeated WorkerInfo workers = 1;
}

// Compatibility RPC name for host work assignment polling.
// The worker model is host-manager oriented, not one-worker-per-run.
message LeaseWorkRequest {
  string worker_id = 1;
  string auth_token = 2;
}

// Compatibility response shape for host work assignment polling.
message LeaseWorkResponse {
  string lease_id = 1;
  string worker_id = 2;
  string project_id = 3;
  string effect = 4;
  string issue_id = 5;
  string run_id = 6;
  int64 leased_at_unix = 7;
  int64 expires_at_unix = 8;
  string payload_json = 9;
}

// Compatibility RPC name for worker completion ACKs.
message AcknowledgeEffectRequest {
  string worker_id = 1;
  string lease_id = 2;
  bool success = 3;
  string error = 4;
  string result_json = 5;
  string auth_token = 6;
}

message AcknowledgeEffectResponse {}

// --- Short ID Resolution ---

message GetRunByShortIDRequest {
  string short_id = 2;
  RequestContext context = 3;
}

message GetRunByShortIDResponse {
  Run run = 1;
  repeated Event events = 2;
}

// --- Issue Resolution ---

message ResolveIssueRequest {
  string issue_id = 2;
  bool force = 3;
  RequestContext context = 4;
}

message ResolveIssueResponse {
  string issue_id = 1;
}

message AppendEventRequest {
  string issue_id = 2;
  string run_id = 3;
  string event_type = 4;
  string event_name = 5;
  map<string, string> event_attrs = 6;
  string event_source = 7;
  RequestContext context = 8;
}

message AppendEventResponse {
  bool skipped = 1;
  string reason = 2;
}

message EnsureOpenCodeServerRequest {
  RequestContext context = 2;
}

message EnsureOpenCodeServerResponse {
  int32 port = 1;
  bool already_running = 2;
}

message RegisterRepoRequest {
  string project_root = 1;
}

message RegisterRepoResponse {
  string repo_id = 1;
}

message ListReposRequest {}

message RepoInfo {
  string id = 1;
  string project_root = 2;
}

message ListReposResponse {
  repeated RepoInfo repos = 1;
}

message DeleteRunRequest {
  string issue_id = 2;
  string run_id = 3;
  string short_id = 4;
  bool with_worktree = 5;
  bool with_branch = 6;
  bool force = 7;
  RequestContext context = 8;
}

message DeleteRunResponse {
  string issue_id = 1;
  string run_id = 2;
  string short_id = 3;
  bool worktree_removed = 4;
  bool branch_removed = 5;
  bool session_killed = 6;
}

message CleanRunWorktreeRequest {
  string issue_id = 1;
  string run_id = 2;
  string short_id = 3;
  RequestContext context = 4;
}

message CleanRunWorktreeResponse {
  string issue_id = 1;
  string run_id = 2;
  string short_id = 3;
  string worktree_path = 4;
  bool worktree_removed = 5;
  bool skipped = 6;
  string reason = 7;
}

message UpdateIssueRequest {
  string issue_id = 2;
  string title = 3;
  string summary = 4;
  string body = 5;
  string status = 6;
  RequestContext context = 7;
}

message UpdateIssueResponse {
  Issue issue = 1;
}

message ValidateIssueFilesRequest {
  string issue_id = 2;
  RequestContext context = 3;
}

message ValidationIssue {
  string code = 1;
  string message = 2;
  int32 line = 3;
  string level = 4;
}

message ValidationResultItem {
  string file = 1;
  string issue_id = 2;
  repeated ValidationIssue errors = 3;
  repeated ValidationIssue warnings = 4;
}

message DuplicateIDItem {
  string id = 1;
  repeated string files = 2;
}

message ValidateIssueFilesResponse {
  int32 total = 1;
  int32 valid = 2;
  repeated ValidationResultItem errors = 3;
  repeated ValidationResultItem warnings = 4;
  repeated DuplicateIDItem duplicates = 5;
}

message WriteAgentPromptRequest {
  string issue_id = 2;
  string run_id = 3;
  string short_id = 4;
  string content = 5;
  RequestContext context = 6;
}

message WriteAgentPromptResponse {}

message ReadAgentPromptRequest {
  string issue_id = 2;
  string run_id = 3;
  string short_id = 4;
  RequestContext context = 5;
}

message ReadAgentPromptResponse {
  string content = 1;
}

message RepairStateRequest {
  bool dry_run = 1;
  bool force = 2;
}

message RepairStateResponse {
  int32 problems_found = 1;
  int32 problems_fixed = 2;
  repeated string details = 3;
}

message GetDaemonLogRequest {
  int32 lines = 1;
}

message GetDaemonLogResponse {
  string content = 1;
}

message ReadFileRequest {
  string path = 1;
}

message ReadFileResponse {
  bytes content = 1;
}

message WriteFileRequest {
  string path = 1;
  bytes content = 2;
  uint32 perm = 3;
}

message WriteFileResponse {}

message KillSessionRequest {
  string session_name = 1;
  Multiplexer multiplexer = 2;
}

message KillSessionResponse {
  bool killed = 1;
}

message ListSessionsRequest {
  Multiplexer multiplexer = 1;
}

message ListSessionsResponse {
  repeated string sessions = 1;
}

message ResumeRunRequest {
  string issue_id = 2;
  string run_id = 3;
  string short_id = 4;
  RequestContext context = 5;
}

message ResumeRunResponse {
  string session_name = 1;
}

message QueryOpenCodeServerRequest {
  int32 port = 1;
}

message OpenCodeProviderInfo {
  string id = 1;
  string name = 2;
  repeated OpenCodeModelInfo models = 3;
}

message OpenCodeModelInfo {
  string id = 1;
  string name = 2;
  repeated string variants = 3;
}

message QueryOpenCodeServerResponse {
  bool server_running = 1;
  repeated OpenCodeProviderInfo providers = 2;
  map<string, string> session_status = 3;
}

message InjectInitialPromptRequest {
  string issue_id = 2;
  string run_id = 3;
  string prompt = 4;
  string model = 5;
  string model_variant = 6;
  string work_dir = 7;
  int32 port = 8;
  RequestContext context = 9;
}

message InjectInitialPromptResponse {
  string session_id = 1;
  int32 port = 2;
}

message ContinueRunRequest {
  // Source: either from_run or from_branch (use issue_id + run_id for from_run, issue_id + branch for from_branch)
  string issue_id = 3;
  string run_id = 4;
  string short_id = 5;
  string branch = 6;
  // Overrides
  string agent = 7;
  string agent_cmd = 8;
  string agent_profile = 9;
  string worktree_dir = 10;
  bool no_pr = 11;
  string prompt_template = 12;
  string pr_target_branch = 13;
  string multiplexer = 14;
  string session_name = 15;
  RequestContext context = 17;
}

message ContinueRunResponse {
  string run_id = 1;
  string branch = 2;
  string worktree_path = 3;
  string session_name = 4;
  string status = 5;
  string continued_from = 6;
  string issue_id = 7;
}

// --- Config ---

message GetConfigRequest {
  RequestContext context = 2;
}

message SlackConfigProto {
  bool enabled = 1;
  string webhook_url = 2;
  string bot_token = 3;
  string channel = 4;
  repeated string notify_on = 5;
}

message OpenCodeConfigProto {
  string default_model = 1;
  string default_variant = 2;
  string prompt_template = 3;
  repeated string extra_args = 4;
  repeated string control_extra_args = 5;
}

message ClaudeConfigProto {
  string prompt_template = 1;
  repeated string extra_args = 2;
  repeated string control_extra_args = 3;
}

message CodexConfigProto {
  string prompt_template = 1;
  repeated string extra_args = 2;
  repeated string control_extra_args = 3;
}

message GeminiConfigProto {
  string prompt_template = 1;
  repeated string extra_args = 2;
  repeated string control_extra_args = 3;
}

message PresetProto {
  string name = 1;
  string backend = 2;
  string model = 3;
  string variant = 4;
  string profile = 5;
}

message IssuesConfigProto {
  string backend = 1;
  string path = 2;
}

message GitHubConfigProto {
  string owner = 1;
  string repo = 2;
  string label_filter = 3;
  int32 poll_interval = 4;
  map<string, string> status_labels = 5;
}

message MonitorConfigProto {
  repeated string ps_columns = 1;
}

message GetConfigResponse {
  string agent = 1;
  string model = 2;
  string model_variant = 3;
  string worktree_dir = 4;
  string base_branch = 5;
  string pr_target_branch = 6;
  string log_level = 7;
  string prompt_template = 8;
  string multiplexer = 9;
  string monitor_multiplexer = 10;
  string agent_multiplexer = 11;
  bool no_pr = 12;
  string default_preset = 13;
  string control_agent = 14;
  string control_model = 15;
  string control_model_variant = 16;
  string diff_tool = 17;
  MonitorConfigProto monitor = 18;
  repeated PresetProto presets = 19;
  OpenCodeConfigProto opencode = 20;
  ClaudeConfigProto claude = 21;
  CodexConfigProto codex = 22;
  GeminiConfigProto gemini = 23;
  SlackConfigProto slack = 24;
  IssuesConfigProto issues = 25;
  GitHubConfigProto github = 26;
}

// --- Daemon Status ---

message GetDaemonStatusRequest {}

message GetDaemonStatusResponse {
  bool running = 1;
  int32 pid = 2;
  string log_path = 3;
  string version = 4;
}

// =============================================================================
// Unified Request/Response (for Unix socket dispatch)
// =============================================================================

message Request {
  oneof request {
    PingRequest ping = 1;
    ListRunsRequest list_runs = 2;
    GetRunRequest get_run = 3;
    StartRunRequest start_run = 4;
    StopRunRequest stop_run = 5;
    ResolveRunRequest resolve_run = 6;
    WaitForStatusRequest wait_for_status = 55;
    ListIssuesRequest list_issues = 7;
    GetIssueRequest get_issue = 8;
    CreateIssueRequest create_issue = 9;
    CloseIssueRequest close_issue = 10;
    GetControlAgentLaunchRequest get_control_agent_launch = 11;
    GetAttachInfoRequest get_attach_info = 12;
    CaptureSessionRequest capture_session = 13;
    SendMessageRequest send_message = 14;
    GetDiffStatsRequest get_diff_stats = 15;
    GetBranchStateRequest get_branch_state = 16;
    GetDiffRequest get_diff = 17;
    RegisterMonitorRequest register_monitor = 18;
    UnregisterMonitorRequest unregister_monitor = 19;
    HeartbeatRequest heartbeat = 20;
    ListMonitorsRequest list_monitors = 21;
    KillMonitorRequest kill_monitor = 22;
    GetRunByShortIDRequest get_run_by_short_id = 23;
    ResolveIssueRequest resolve_issue = 24;
    AppendEventRequest append_event = 25;
    EnsureOpenCodeServerRequest ensure_opencode_server = 26;
    RegisterRepoRequest register_repo = 27;
    ListReposRequest list_repos = 28;
    DeleteRunRequest delete_run = 29;
    UpdateIssueRequest update_issue = 30;
    ValidateIssueFilesRequest validate_issue_files = 31;
    WriteAgentPromptRequest write_agent_prompt = 32;
    ReadAgentPromptRequest read_agent_prompt = 33;
    RepairStateRequest repair_state = 34;
    GetDaemonLogRequest get_daemon_log = 35;
    ReadFileRequest read_file = 36;
    WriteFileRequest write_file = 37;
    CreateRunRequest create_run = 38;
    KillSessionRequest kill_session = 39;
    ListSessionsRequest list_sessions = 40;
    ResumeRunRequest resume_run = 41;
    QueryOpenCodeServerRequest query_opencode_server = 42;
    InjectInitialPromptRequest inject_initial_prompt = 43;
    ContinueRunRequest continue_run = 44;
    GetConfigRequest get_config = 45;
    GetDaemonStatusRequest get_daemon_status = 46;
    GetControlAgentConfigRequest get_control_agent_config = 47;
    RegisterWorkerRequest register_worker = 48;
    UnregisterWorkerRequest unregister_worker = 49;
    WorkerHeartbeatRequest worker_heartbeat = 50;
    ListWorkersRequest list_workers = 51;
    LeaseWorkRequest lease_work = 52;
    AcknowledgeEffectRequest acknowledge_effect = 53;
    CleanRunWorktreeRequest clean_run_worktree = 54;
  }
}

message Response {
  bool ok = 1;
  string error = 2;
  
  oneof response {
    PingResponse ping = 3;
    ListRunsResponse list_runs = 4;
    GetRunResponse get_run = 5;
    StartRunResponse start_run = 6;
    StopRunResponse stop_run = 7;
    ResolveRunResponse resolve_run = 8;
    WaitForStatusResponse wait_for_status = 57;
    ListIssuesResponse list_issues = 9;
    GetIssueResponse get_issue = 10;
    CreateIssueResponse create_issue = 11;
    CloseIssueResponse close_issue = 12;
    GetControlAgentLaunchResponse get_control_agent_launch = 13;
    GetAttachInfoResponse get_attach_info = 14;
    CaptureSessionResponse capture_session = 15;
    SendMessageResponse send_message = 16;
    GetDiffStatsResponse get_diff_stats = 17;
    GetBranchStateResponse get_branch_state = 18;
    GetDiffResponse get_diff = 19;
    RegisterMonitorResponse register_monitor = 20;
    UnregisterMonitorResponse unregister_monitor = 21;
    HeartbeatResponse heartbeat = 22;
    ListMonitorsResponse list_monitors = 23;
    KillMonitorResponse kill_monitor = 24;
    GetRunByShortIDResponse get_run_by_short_id = 25;
    ResolveIssueResponse resolve_issue = 26;
    AppendEventResponse append_event = 27;
    EnsureOpenCodeServerResponse ensure_opencode_server = 28;
    RegisterRepoResponse register_repo = 29;
    ListReposResponse list_repos = 30;
    DeleteRunResponse delete_run = 31;
    UpdateIssueResponse update_issue = 32;
    ValidateIssueFilesResponse validate_issue_files = 33;
    WriteAgentPromptResponse write_agent_prompt = 34;
    ReadAgentPromptResponse read_agent_prompt = 35;
    RepairStateResponse repair_state = 36;
    GetDaemonLogResponse get_daemon_log = 37;
    ReadFileResponse read_file = 38;
    WriteFileResponse write_file = 39;
    CreateRunResponse create_run = 40;
    KillSessionResponse kill_session = 41;
    ListSessionsResponse list_sessions = 42;
    ResumeRunResponse resume_run = 43;
    QueryOpenCodeServerResponse query_opencode_server = 44;
    InjectInitialPromptResponse inject_initial_prompt = 45;
    ContinueRunResponse continue_run = 46;
    GetConfigResponse get_config = 47;
    GetDaemonStatusResponse get_daemon_status = 48;
    GetControlAgentConfigResponse get_control_agent_config = 49;
    RegisterWorkerResponse register_worker = 50;
    UnregisterWorkerResponse unregister_worker = 51;
    WorkerHeartbeatResponse worker_heartbeat = 52;
    ListWorkersResponse list_workers = 53;
    LeaseWorkResponse lease_work = 54;
    AcknowledgeEffectResponse acknowledge_effect = 55;
    CleanRunWorktreeResponse clean_run_worktree = 56;
  }
}
