syntax = "proto3";

package orch.v1;

option go_package = "github.com/s22625/orch/api/orchpb";

// =============================================================================
// Enums
// =============================================================================

enum RunStatus {
  RUN_STATUS_UNSPECIFIED = 0;
  RUN_STATUS_QUEUED = 1;
  RUN_STATUS_BOOTING = 2;
  RUN_STATUS_RUNNING = 3;
  RUN_STATUS_BLOCKED = 4;
  RUN_STATUS_BLOCKED_API = 5;
  RUN_STATUS_PR_OPEN = 6;
  RUN_STATUS_DONE = 7;
  RUN_STATUS_FAILED = 8;
  RUN_STATUS_CANCELED = 9;
}

enum IssueStatus {
  ISSUE_STATUS_UNSPECIFIED = 0;
  ISSUE_STATUS_OPEN = 1;
  ISSUE_STATUS_RESOLVED = 2;
  ISSUE_STATUS_CLOSED = 3;
}

enum BranchState {
  BRANCH_STATE_UNSPECIFIED = 0;
  BRANCH_STATE_CLEAN = 1;
  BRANCH_STATE_DIRTY = 2;
  BRANCH_STATE_MERGED = 3;
  BRANCH_STATE_CONFLICT = 4;
  BRANCH_STATE_AHEAD = 5;
  BRANCH_STATE_BEHIND = 6;
  BRANCH_STATE_DIVERGED = 7;
  BRANCH_STATE_SYNCED = 8;
}

enum Multiplexer {
  MULTIPLEXER_UNSPECIFIED = 0;
  MULTIPLEXER_TMUX = 1;
  MULTIPLEXER_ZELLIJ = 2;
}

// =============================================================================
// Domain Models
// =============================================================================

message DiffStats {
  int32 additions = 1;
  int32 deletions = 2;
  int32 files_changed = 3;
  repeated string files = 4;
}

message Run {
  string issue_id = 1;
  string run_id = 2;
  RunStatus status = 3;
  string agent = 4;
  string model = 5;
  string branch = 6;
  string worktree_path = 7;
  string pr_url = 8;
  int64 started_at_unix = 9;
  int64 updated_at_unix = 10;
  int32 elapsed_seconds = 11;
  string elapsed_display = 12;
  DiffStats diff_stats = 13;
  BranchState branch_state = 14;
  string tmux_session = 15;
  Multiplexer multiplexer = 16;
  int32 server_port = 17;
  string opencode_session_id = 18;
  string continued_from = 19;
}

message Issue {
  string id = 1;
  string title = 2;
  string summary = 3;
  IssueStatus status = 4;
  repeated string tags = 5;
  string body = 6;
  string path = 7;
  int64 modified_at_unix = 8;
  string topic = 9;
}

message Event {
  int64 timestamp_unix = 1;
  string type = 2;
  string name = 3;
  map<string, string> attrs = 4;
}

// =============================================================================
// Requests & Responses
// =============================================================================

// --- Lifecycle ---

message PingRequest {}
message PingResponse {
  bool ok = 1;
  string version = 2;
}

// --- Runs ---

message ListRunsRequest {
  string issues_root = 1;
  string issue_id = 2;
  repeated RunStatus status = 3;
  string agent = 4;
  string text_search = 5;
  string time_range = 6;  // "hour", "today", "week"
  int32 limit = 7;
  string cursor = 8;
}

message ListRunsResponse {
  repeated Run runs = 1;
  int32 total = 2;
  string next_cursor = 3;
}

message GetRunRequest {
  string issues_root = 1;
  string issue_id = 2;
  string run_id = 3;
}

message GetRunResponse {
  Run run = 1;
  repeated Event events = 2;
}

message StartRunRequest {
  string issues_root = 1;
  string issue_id = 2;
  string agent = 3;
  string model = 4;
  string model_variant = 5;
  string base_branch = 6;
  string project_root = 7;
}

message StartRunResponse {
  string run_id = 1;
  string branch = 2;
  string worktree_path = 3;
  string tmux_session = 4;
}

message CreateRunRequest {
  string issues_root = 1;
  string issue_id = 2;
  string run_id = 3;
  map<string, string> metadata = 4;
}

message CreateRunResponse {
  string issue_id = 1;
  string run_id = 2;
  string path = 3;
}

message StopRunRequest {
  string issues_root = 1;
  string issue_id = 2;
  string run_id = 3;
}

message StopRunResponse {}

message ResolveRunRequest {
  string issues_root = 1;
  string issue_id = 2;
  string run_id = 3;
}

message ResolveRunResponse {}

// --- Issues ---

message ListIssuesRequest {
  string issues_root = 1;
  repeated IssueStatus status = 2;
  repeated string tags = 3;
  string tags_mode = 4;  // "and" or "or"
  string text_search = 5;
  int32 limit = 6;
  string cursor = 7;
}

message ListIssuesResponse {
  repeated Issue issues = 1;
  int32 total = 2;
  string next_cursor = 3;
}

message GetIssueRequest {
  string issues_root = 1;
  string issue_id = 2;
}

message GetIssueResponse {
  Issue issue = 1;
}

message CreateIssueRequest {
  string issues_root = 1;
  string issue_id = 2;
  string title = 3;
  string body = 4;
}

message CreateIssueResponse {
  string path = 1;
}

message CloseIssueRequest {
  string issues_root = 1;
  string issue_id = 2;
}

message CloseIssueResponse {}

// --- Control Agent ---

message GetControlAgentLaunchRequest {
  string project_root = 1;
  string agent = 2;
  bool new_session = 3;
}

message GetControlAgentLaunchResponse {
  string command = 1;
  string prompt_file = 2;
  int32 port = 3;
  string session_id = 4;
}

// --- Session Operations ---

message GetAttachInfoRequest {
  string issues_root = 1;
  string issue_id = 2;
  string run_id = 3;
  string short_id = 4;
}

message GetAttachInfoResponse {
  repeated string command = 1;
  Multiplexer multiplexer = 2;
  string session_name = 3;
  string worktree_path = 4;
  string agent = 5;
  int32 server_port = 6;
  string opencode_session_id = 7;
  string issue_id = 8;
  string run_id = 9;
}

message CaptureSessionRequest {
  string issues_root = 1;
  string issue_id = 2;
  string run_id = 3;
}

message CaptureSessionResponse {
  string content = 1;
  int64 timestamp_unix = 2;
  string source = 3;
}

message SendMessageRequest {
  string issues_root = 1;
  string issue_id = 2;
  string run_id = 3;
  string message = 4;
}

message SendMessageResponse {}

// --- Git Operations ---

message GetDiffStatsRequest {
  string issues_root = 1;
  string issue_id = 2;
  string run_id = 3;
}

message GetDiffStatsResponse {
  DiffStats diff_stats = 1;
}

message GetBranchStateRequest {
  string issues_root = 1;
  string issue_id = 2;
  string run_id = 3;
}

message GetBranchStateResponse {
  BranchState state = 1;
}

message GetDiffRequest {
  string issues_root = 1;
  string issue_id = 2;
  string run_id = 3;
}

message GetDiffResponse {
  string diff = 1;
}

// --- Monitor Registration ---

message RegisterMonitorRequest {
  int32 pid = 1;
  string monitor_type = 2;
  string view = 3;
  string project = 4;
  string session_name = 5;
}

message RegisterMonitorResponse {
  string monitor_id = 1;
}

message UnregisterMonitorRequest {
  string monitor_id = 1;
}

message UnregisterMonitorResponse {}

message HeartbeatRequest {
  string monitor_id = 1;
}

message HeartbeatResponse {}

message ListMonitorsRequest {
  string project = 1;
  bool all = 2;
}

message MonitorInfo {
  string id = 1;
  int32 pid = 2;
  string type = 3;
  string view = 4;
  string project = 5;
  string session_name = 6;
  int64 started_at_unix = 7;
  int64 last_heartbeat_unix = 8;
}

message ListMonitorsResponse {
  repeated MonitorInfo monitors = 1;
}

message KillMonitorRequest {
  string monitor_id = 1;
  bool all = 2;
  bool global = 3;
  string project = 4;
}

message KillMonitorResponse {
  int32 killed_count = 1;
}

// --- Short ID Resolution ---

message GetRunByShortIDRequest {
  string issues_root = 1;
  string short_id = 2;
}

message GetRunByShortIDResponse {
  Run run = 1;
  repeated Event events = 2;
}

// --- Issue Resolution ---

message ResolveIssueRequest {
  string issues_root = 1;
  string issue_id = 2;
  bool force = 3;
}

message ResolveIssueResponse {
  string issue_id = 1;
}

message AppendEventRequest {
  string issues_root = 1;
  string issue_id = 2;
  string run_id = 3;
  string event_type = 4;
  string event_name = 5;
  map<string, string> event_attrs = 6;
  string event_source = 7;
}

message AppendEventResponse {
  bool skipped = 1;
  string reason = 2;
}

message EnsureOpenCodeServerRequest {
  string project_root = 1;
}

message EnsureOpenCodeServerResponse {
  int32 port = 1;
  bool already_running = 2;
}

message RegisterRepoRequest {
  string project_root = 1;
}

message RegisterRepoResponse {
  string repo_id = 1;
}

message ListReposRequest {}

message RepoInfo {
  string id = 1;
  string project_root = 2;
  string issues_root = 3;
}

message ListReposResponse {
  repeated RepoInfo repos = 1;
}

message DeleteRunRequest {
  string issues_root = 1;
  string issue_id = 2;
  string run_id = 3;
  string short_id = 4;
  bool with_worktree = 5;
  bool with_branch = 6;
  bool force = 7;
}

message DeleteRunResponse {
  string issue_id = 1;
  string run_id = 2;
  string short_id = 3;
  bool worktree_removed = 4;
  bool branch_removed = 5;
  bool session_killed = 6;
}

message UpdateIssueRequest {
  string issues_root = 1;
  string issue_id = 2;
  string title = 3;
  string summary = 4;
  string body = 5;
  string status = 6;
}

message UpdateIssueResponse {
  Issue issue = 1;
}

message ValidateIssueFilesRequest {
  string issues_root = 1;
  string issue_id = 2;
}

message ValidationIssue {
  string code = 1;
  string message = 2;
  int32 line = 3;
  string level = 4;
}

message ValidationResultItem {
  string file = 1;
  string issue_id = 2;
  repeated ValidationIssue errors = 3;
  repeated ValidationIssue warnings = 4;
}

message DuplicateIDItem {
  string id = 1;
  repeated string files = 2;
}

message ValidateIssueFilesResponse {
  int32 total = 1;
  int32 valid = 2;
  repeated ValidationResultItem errors = 3;
  repeated ValidationResultItem warnings = 4;
  repeated DuplicateIDItem duplicates = 5;
}

message WriteAgentPromptRequest {
  string issues_root = 1;
  string issue_id = 2;
  string run_id = 3;
  string short_id = 4;
  string content = 5;
}

message WriteAgentPromptResponse {}

message ReadAgentPromptRequest {
  string issues_root = 1;
  string issue_id = 2;
  string run_id = 3;
  string short_id = 4;
}

message ReadAgentPromptResponse {
  string content = 1;
}

message RepairStateRequest {
  bool dry_run = 1;
  bool force = 2;
}

message RepairStateResponse {
  int32 problems_found = 1;
  int32 problems_fixed = 2;
  repeated string details = 3;
}

message GetDaemonLogRequest {
  int32 lines = 1;
}

message GetDaemonLogResponse {
  string content = 1;
}

message ReadFileRequest {
  string path = 1;
}

message ReadFileResponse {
  bytes content = 1;
}

message WriteFileRequest {
  string path = 1;
  bytes content = 2;
  uint32 perm = 3;
}

message WriteFileResponse {}

// =============================================================================
// Unified Request/Response (for Unix socket dispatch)
// =============================================================================

message Request {
  oneof request {
    PingRequest ping = 1;
    ListRunsRequest list_runs = 2;
    GetRunRequest get_run = 3;
    StartRunRequest start_run = 4;
    StopRunRequest stop_run = 5;
    ResolveRunRequest resolve_run = 6;
    ListIssuesRequest list_issues = 7;
    GetIssueRequest get_issue = 8;
    CreateIssueRequest create_issue = 9;
    CloseIssueRequest close_issue = 10;
    GetControlAgentLaunchRequest get_control_agent_launch = 11;
    GetAttachInfoRequest get_attach_info = 12;
    CaptureSessionRequest capture_session = 13;
    SendMessageRequest send_message = 14;
    GetDiffStatsRequest get_diff_stats = 15;
    GetBranchStateRequest get_branch_state = 16;
    GetDiffRequest get_diff = 17;
    RegisterMonitorRequest register_monitor = 18;
    UnregisterMonitorRequest unregister_monitor = 19;
    HeartbeatRequest heartbeat = 20;
    ListMonitorsRequest list_monitors = 21;
    KillMonitorRequest kill_monitor = 22;
    GetRunByShortIDRequest get_run_by_short_id = 23;
    ResolveIssueRequest resolve_issue = 24;
    AppendEventRequest append_event = 25;
    EnsureOpenCodeServerRequest ensure_opencode_server = 26;
    RegisterRepoRequest register_repo = 27;
    ListReposRequest list_repos = 28;
    DeleteRunRequest delete_run = 29;
    UpdateIssueRequest update_issue = 30;
    ValidateIssueFilesRequest validate_issue_files = 31;
    WriteAgentPromptRequest write_agent_prompt = 32;
    ReadAgentPromptRequest read_agent_prompt = 33;
    RepairStateRequest repair_state = 34;
    GetDaemonLogRequest get_daemon_log = 35;
    ReadFileRequest read_file = 36;
    WriteFileRequest write_file = 37;
    CreateRunRequest create_run = 38;
  }
}

message Response {
  bool ok = 1;
  string error = 2;
  
  oneof response {
    PingResponse ping = 3;
    ListRunsResponse list_runs = 4;
    GetRunResponse get_run = 5;
    StartRunResponse start_run = 6;
    StopRunResponse stop_run = 7;
    ResolveRunResponse resolve_run = 8;
    ListIssuesResponse list_issues = 9;
    GetIssueResponse get_issue = 10;
    CreateIssueResponse create_issue = 11;
    CloseIssueResponse close_issue = 12;
    GetControlAgentLaunchResponse get_control_agent_launch = 13;
    GetAttachInfoResponse get_attach_info = 14;
    CaptureSessionResponse capture_session = 15;
    SendMessageResponse send_message = 16;
    GetDiffStatsResponse get_diff_stats = 17;
    GetBranchStateResponse get_branch_state = 18;
    GetDiffResponse get_diff = 19;
    RegisterMonitorResponse register_monitor = 20;
    UnregisterMonitorResponse unregister_monitor = 21;
    HeartbeatResponse heartbeat = 22;
    ListMonitorsResponse list_monitors = 23;
    KillMonitorResponse kill_monitor = 24;
    GetRunByShortIDResponse get_run_by_short_id = 25;
    ResolveIssueResponse resolve_issue = 26;
    AppendEventResponse append_event = 27;
    EnsureOpenCodeServerResponse ensure_opencode_server = 28;
    RegisterRepoResponse register_repo = 29;
    ListReposResponse list_repos = 30;
    DeleteRunResponse delete_run = 31;
    UpdateIssueResponse update_issue = 32;
    ValidateIssueFilesResponse validate_issue_files = 33;
    WriteAgentPromptResponse write_agent_prompt = 34;
    ReadAgentPromptResponse read_agent_prompt = 35;
    RepairStateResponse repair_state = 36;
    GetDaemonLogResponse get_daemon_log = 37;
    ReadFileResponse read_file = 38;
    WriteFileResponse write_file = 39;
    CreateRunResponse create_run = 40;
  }
}
