repos:
  - repo: local
    hooks:
      - id: go-architecture-lint
        name: Go CLI Architecture Lint (semgrep)
        entry: make lint
        language: system
        pass_filenames: false
        files: ^internal/cli/.*\.go$

      - id: tui-architecture-lint
        name: Python TUI Architecture Lint (semgrep)
        entry: bash -c 'cd orch-monitor-tui && make lint'
        language: system
        pass_filenames: false
        files: ^orch-monitor-tui/orch_monitor/.*\.(py|hy)$
