repos:
  - repo: local
    hooks:
      - id: go-architecture-lint
        name: Go Architecture Lint (semgrep)
        entry: make lint
        language: system
        pass_filenames: false
        files: ^internal/(cli|monitor|daemon)/.*\.go$

      - id: tui-architecture-lint
        name: Python TUI Architecture Lint (semgrep)
        entry: make -C orch-monitor-tui lint
        language: system
        pass_filenames: false
        files: ^orch-monitor-tui/orch_monitor/.*\.(py|hy)$
