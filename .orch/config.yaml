# orch uses itself as the vault - issues live in this repo
#agent: opencode
agent: claude
worktree_dir: .git-worktrees
base_branch: main
pr_target_branch: main

# Agent-specific configuration with extra CLI arguments
claude:
  extra_args:
    - "--dangerously-skip-permissions"

opencode:
  default_model: anthropic/claude-opus-4-5
  default_variant: max

issues:
  backend: local
  path: ~/repos/orch-issues

# Keep GitHub config for future use or hybrid mode
github:
  owner: proboscis
  repo: orch
  poll_interval: 300

monitor:
  default_run_statuses:
    - queued
    - booting
    - running
    - blocked
    - blocked_api
    - pr_open
  default_issue_statuses:
    - open
