# land-queue 宣言(dotfiles ADR-DOTFILES-017 の機構、repo-local 方策)。
# 敷設 2026-08-09(land-queue-all-repos-rollout 便 — operator 指示「全部の repo で
# 利用したい」+ operator 決裁 sha d54350a8)。mixed repo(proboscis/orch* は
# company-mixed-repos.txt 登載)— 編集は任意席・著述は個人系。
# battery 実測 2026-08-09 全 green: make test(go test 直列・integration 含む
# 約 5 分)+ make lint(semgrep 建築 lint — AGENTS.md 明文の正典)+ go build +
# docs/adr 7 passed(49s)。
# ⚠ make test の lock は /tmp/orch-go-test.lock(機械全域)— 他席のテスト走行と
# 衝突すると loud fail(窓は失敗で返る = 正常系。再登記で再走)。

[land-queue]
enabled = true
base = "main"

[gate]
# 実行面 = zeus(k3s クラスタ機)— operator 裁定伝言 2026-08-17『テストはk3sでやって』
# (方向宣言 land-verify-tests-on-k3s)。remote_check が tree を送り逐語実行し、
# 不達は --fallback-local でこの機体へ可視に倒す(ran= の 1 行が log に残る)。
#
# 09309235 が置いた暫定の分層(internal/daemon + internal/pr + docs/adr だけ Mac で
# 後段実行)は撤去した。分層の理由だったテストの機体依存 3 点をこの便で根治し、
# 遠隔でも同じ答えが出るようになったため — 検査の意味が「どの機体で走るか」に
# 依存しない形へ戻った(方向宣言 orch-tests-decided-by-sent-tree)。
# 退役の根拠(2026-08-18 実測・zeus・.git を含まない tree・go clean -testcache 後):
# go test 20 package 全部 ok(internal/daemon 17.0s / internal/pr 0.045s /
# test/integration 13.3s)・make lint 通過・docs/adr 7 passed・rc=0。
# 2026-10-07(agora-redesign #3879・cisco-c8 の決め・戻せる): 全部の処理ステージに欄 pytest(pytest の session を走らせるか)を書く。
# 日次の全体検証は true の処理ステージで session が 1 本も答えなければ、カバレッジの欠けに数える。
# 1 本の文字列の宣言は欄を書けないので、同じ名 full・同じ命令の処理ステージ 1 つの列に書き直した(記録の名は変わらない)。
# true = full(make test の後に uv run pytest docs/adr を呼ぶ・走った日次で session の行 1 本)。戻すには列を元の 1 本の文字列へ戻す。
full = [
  { name = "full", run = "python3 $HOME/dotfiles/agentcli/src/agentcli/remote_check.py --node zeus --tree . --label orch-gate-full --sync-timeout 600 --run-timeout 1800 --fallback-local -- sh -c 'go build ./... && make test && make lint && PYTHONUNBUFFERED=1 uv run pytest docs/adr -q'", pytest = true },
]
# 遠隔の最悪(sync 600 + run 1800)を包む。全走が遠隔 1 段に戻ったので Mac 側の
# 後段ぶんは要らないが、余裕は残す(zeus の実測は全部で 2 分未満)。
# 2026-10-02(agora-redesign #2589): 日次の全体検証の予算を別の鍵 full_timeout_s へ移した(merge-queue L195 で予算と窓の門の上限を別の
# 鍵に分けた)。値はそのまま。窓の門の上限 timeout_s は宣言せず merge-queue の既定 600 秒(門は衝突の走査で数秒)に任せる。
# 戻し方 = 鍵の名を timeout_s へ戻す。
full_timeout_s = 3600

# R-7a95702d focus mode(operator 直命 2026-08-17「全ての repo の merge queue が
# 10 分以上待っていてはいけない」・同日逐語「mergeにテストは必須じゃない」):
# 着地の門は merge の力学のみ。テストは事後 = 日次全量検査(gate.full を
# ai land verify が使う — launchd 便は別途敷設)+ stable 昇格 + fix-forward。
# 先例 = dotfiles / herdr-hud D568 / ACP / doeff(2026-08-17 同日)。
mode = "focus"
# 着地の門 = git の衝突の印の走査ちょうど(agora-redesign #726・2026-09-28 c2-w25)。merge-queue の窓は
#   focus_paths_runner の宣言が無い区画を開かないので、agora-controllers / herdr-hud と同じ 1 行を置く。
#   行頭の `<<<<<<< ` / `>>>>>>> ` の一致なし(git grep の rc 1)だけを通し、一致(rc 0)と git の失敗(rc 128)は止める。
#   テストは足さない(門は merge の力学のみ)。戻すには この行と [policy] runner を消す。
focus_paths_runner = '''git grep -n -E '^(<<<<<<< |>>>>>>> )' -- . && exit 1 || test $? -eq 1'''
# 方策宣言そのものへの変更だけは常時 full battery(自己参照の fail-closed)
# ⚠ 2026-08-17 operator 逐語「全量検査を無効にしてくれ」: full_paths を空に —
# 着地の窓はいかなる path でも全量検査(gate.full)を走らせない。gate.full の
# 唯一の消費者 = 日次検証便(ai land verify・launchd)。方策 toml の変更も
# 窓では力学のみで着地する(検分は事後 + fix-forward)。復活は operator 裁定で。
full_paths = []

# R-94ede4bc 投機列車(operator 直接指示 2026-08-17「merge queue の投機テストを
# 全 repo で適用」— 連邦の機構 = dotfiles land.py・先例 = dotfiles 裁定 2026-08-16
# decision-land-speculation-enable / herdr-hud D568)。窓は確定 train(消費済み
# 緑の先端・公開対象)と投機 tip を分け、gate の実行だけを backend へ並列に
# 発注する(判定の消費は直列同値・赤 1 便で窓ごと abort する形の根治)。厳密 bool。
# 戻し方 = この行を外す便を着地させる(既定 off・law opt-in-inert)。
speculation = true
# 検査 backend(law policy-in-toml)。重い cold build を重ねて飽和機の load を倍にしない保守初期値。
# 実測(last_run.speculation)を見て上げる — 恒久解 = L440 の k3s self-hosted
# runner(external backend 段 2)への移設。
[gate.backend]
kind = "local"
max_parallel = 1
join_s = 60

[gate.tiers]
"docs/adr/" = "PYTHONUNBUFFERED=1 uv run pytest docs/adr -q"
"docs/" = "true"
"notes/" = "true"
"README.md" = "true"
".agents/land-queue.toml" = "true"

[policy]
# 着地する commit の本文へ、依頼が属する追跡先の issue への参照 `Refs: proboscis/agora-redesign#N` を着地の窓が足す
#   (merge-queue の窓・agora-redesign #2428)。issue の画面から、その issue で入った差分を開けるようにするため。
#   番号 = 依頼の題が最初に指す番号(`agora-redesign #N` の明記が先)。
#   裸の `#N` は読まない(この repo は自分の issue / PR の番号を題に書くので、取り違えない)。
#   戻し方 = この 2 行と註を消す(two-way door・決めた記録 = agora-redesign #2428 の comment)。
issue_tracker = "proboscis/agora-redesign"
issue_tracker_bare = false
run_executors = ["landrun-orch", "landrun-rollout", "machine"]
# 着地の窓を回すのは merge-queue の Deployment `merge-queue-land`(ns herdr-hud)— agora-redesign #726・2026-09-28 c2-w25。
#   押す鍵 = Secret land-key-orch(GitHub の deploy key `agora-1-pod (write) land-runner orch`・merge-queue の deploy/land が載せる)。
#   戻し方 = この行を消す(無宣言 = mac の窓へ戻る・1 行の便)。
runner = "merge-queue"
auto_run = true
urgent_slots = 1
push = "origin"
base_move_follow_retries = 2
# 日次検証の全走が緑の断面だけが昇格する(R-7a95702d)
stable_branch = "stable"

[test-admission]
# 広い test 走行の受付(法 ADR-DOTFILES-027 R-9c56a2dd broad-test-runs-need-an-explicit-grant・
# card acp:kanban-issue:ki-f486a3cbb6a3)。判定(広いか)・30 分の窓の合算・許可の消費は
# **正本 1 点**(~/dotfiles/agent/tests/broad_run_admission.py)が持ち、この repo は **値だけ** を
# 宣言する。⚠ 判定の写しを toml にも conftest にも置かない — 写すと方策を動かした日に片方だけ
# 古い答えを返す(先に据えた区画 argus / pr-review / herdr-hud / doeff / agora-controllers と同じ作法)。
#
# 結線 = **conftest.py 2 本**。この repo は pytest の面が 2 つ在り、rootdir が別々だから:
#   1. repo の root の conftest.py … root の pyproject.toml が [tool.pytest.ini_options] を持つので
#      rootdir = repo の根で固定され、上の [gate].full の `uv run pytest docs/adr` も焦点走も読む。
#   2. orch-monitor-tui/conftest.py … orch-monitor-tui/ は自前の pyproject.toml に ini を持つので
#      そこで撃った走行の rootdir は **その dir** になり、1. は読まれない(pytest は rootdir より上へ
#      conftest を遡らない)。方策はこの表 1 枚のままでよい — 受付は対象から .agents/land-queue.toml を
#      持つ根まで遡って方策を引く。
# ⚠ 宣言(この表)と委譲(conftest 2 本)は **対で 1 commit**。表だけ消すと read_policy →
#   PolicyUndeclared → pytest.UsageError(rc 4)で本数に依らず焦点走まで全滅する(受付の fail-closed)。
#   戻し方 = commit ごと revert(two-way door)。
#
# per_run_max = 1 走行で選ばれる test の上限(超えたら広い = 許可が要る)。
#   実測 2026-09-20(会社 Mac・origin/main@d11736ca・`--co` の収集だけ):
#     - 上の [gate].full の pytest の処理ステージ = `uv run pytest docs/adr -q` = **7 本**(実走 21.6 秒)。
#       [gate.tiers] の "docs/adr/" も同じ 7 本。7 ≤ 100 ⇒ 広くないので受付は素通しする。
#     - もう 1 つの面 orch-monitor-tui の全数 = `uv run --extra test pytest tests/` = **300 本**
#       (+ 収集の error 6 件 — protobuf の版の食い違いで、この便より前から在る別件)。
#       300 > 100 ⇒ 許可が要る。**この repo で受付が本当に噛むのはここ**で、法の目的もここに在る。
#   ⇒ 100 は docs/adr の全部(7)と tui の焦点走(1 file = 最大 60 本規模)を許可なしで通し、
#     tui の全数(300)を断る位置。
# window_max = 30 分の窓の中の distinct な test の上限(分割して撃っても合算で止まる)。
#   200 = per_run_max の 2 倍 — tui の焦点走を何本か重ねても届かず、全数を 3 分割しても合算で止まる。
per_run_max = 100
window_max = 200
window_s = 1800
# scope=full の許可が消費できる pytest 走行の数 = 上の [gate].full の pytest の処理ステージの数。
# gate.full は `go build && make test && make lint && uv run pytest docs/adr -q` の 1 本鎖で、
# pytest はその最後の 1 回ちょうど ⇒ 1。
full_sessions = 1
# ⚠ cluster_brain_url は **宣言しない**(two-way door の決定 D4・記録 = card ki-f486a3cbb6a3 のスレッド)。
#   この鍵の読み手は cluster_check.forwarded_env ちょうどで、呼び手が k3s の Job を立てて検査を走らせる
#   形を通る repo だけが要る。要るようになったら 1 行足す。
#
# ⚠ この repo の日次の全体検証は 2026-08-27 の operator 裁定で停止中(herdr-hud
#   deploy/periodic/jobs.json の land-verify-orch = blocked・理由 = pod に作業コピーが無い +
#   「点検は開発完了まで止めたまま」)。⇒ 受付を実際に通るのは、人が手で撃つ焦点の検査と着地の窓
#   (mode = "focus" なので [gate.tiers] も [gate].full も撃たない)ちょうど。日次が戻った日に
#   この註を読み直すこと(戻ると gate.full の 7 本が日次の許可の札で走る)。
# ⚠ 残り(この便では直さない): gate.full は remote_check で zeus へ送って走るが、remote_check は
#   許可の env を運ばない。7 本は広くないので断られないが、窓の台帳が zeus 側で書けない拍は
#   `window-unverifiable` で許可が要る形になる(受付の judge の 2 番目の枝)。
