# land-queue 宣言(dotfiles ADR-DOTFILES-017 の機構、repo-local 方策)。
# 敷設 2026-08-09(land-queue-all-repos-rollout 便 — operator 指示「全部の repo で
# 利用したい」+ operator 決裁 sha d54350a8)。mixed repo(proboscis/orch* は
# company-mixed-repos.txt 登載)— 編集は任意席・著述は個人系。
# battery 実測 2026-08-09 全 green: make test(go test 直列・integration 含む
# 約 5 分)+ make lint(semgrep 建築 lint — AGENTS.md 明文の正典)+ go build +
# docs/adr 7 passed(49s)。
# ⚠ make test の lock は /tmp/orch-go-test.lock(機械全域)— 他席のテスト走行と
# 衝突すると loud fail(窓は失敗で返る = 正常系。再登記で再走)。

[land-queue]
enabled = true
base = "main"

[gate]
# 実行面 = zeus(k3s クラスタ機)— operator 裁定伝言 2026-08-17『テストはk3sでやって』
# (方向宣言 land-verify-tests-on-k3s)。remote_check が tree を送り逐語実行し、
# 不達は --fallback-local でこの機体へ可視に倒す(ran= の 1 行が log に残る)。
# 分層(実測 2026-08-17): ① internal/daemon と internal/pr のテストは囲いの checkout
# (origin/main 参照・worktree 作成)と GitHub への実 fetch(資格情報)に依存して
# 遠隔 tree で構造的に赤 — この 2 package だけ後段で local 実行する(TEST_PKGS は
# Makefile の公式 knob。局所実測 = daemon 14.6s + pr 0.1s)② docs/adr(pytest 7 本・
# 15s)も local — 依存 doeff-adr の registry が repo root を .git で探し、遠隔 tree
# (.git なし)で defsemgrep 2 本が立たない(doeff 本体は 61ca71b6 で根治済み・orch の
# pin が旧版)。残り全 package の build + test + lint は zeus(go 1.25.3 は ~/.local
# 導入済み)。根治(テストの密閉化 + doeff-adr pin 更新)は別便で起票済み。
# $(go list ...) は Mac 側では単引用で保護され zeus 側の sh が評価する。
full = "python3 $HOME/dotfiles/agentcli/src/agentcli/remote_check.py --node zeus --tree . --label orch-gate-full --sync-timeout 600 --run-timeout 1800 --fallback-local -- sh -c 'go build ./... && make test TEST_PKGS=\"$(go list ./... | grep -vE \"internal/(daemon|pr)$\" | tr \"\\n\" \" \")\" && make lint' && make test TEST_PKGS=\"./internal/daemon ./internal/pr\" && PYTHONUNBUFFERED=1 uv run pytest docs/adr -q"
# 2400 → 3600(2026-08-17): 遠隔の最悪(sync 600 + run 1800)+ 後段 local 2 package
# の合計が旧値を越えるため。
timeout_s = 3600

# R-7a95702d focus mode(operator 直命 2026-08-17「全ての repo の merge queue が
# 10 分以上待っていてはいけない」・同日逐語「mergeにテストは必須じゃない」):
# 着地の門は merge の力学のみ。テストは事後 = 日次全量検査(gate.full を
# ai land verify が使う — launchd 便は別途敷設)+ stable 昇格 + fix-forward。
# 先例 = dotfiles / herdr-hud D568 / ACP / doeff(2026-08-17 同日)。
mode = "focus"
# 方策宣言そのものへの変更だけは常時 full battery(自己参照の fail-closed)
# ⚠ 2026-08-17 operator 逐語「全量検査を無効にしてくれ」: full_paths を空に —
# 着地の窓はいかなる path でも全量検査(gate.full)を走らせない。gate.full の
# 唯一の消費者 = 日次検証便(ai land verify・launchd)。方策 toml の変更も
# 窓では力学のみで着地する(検分は事後 + fix-forward)。復活は operator 裁定で。
full_paths = []

# R-94ede4bc 投機列車(operator 直接指示 2026-08-17「merge queue の投機テストを
# 全 repo で適用」— 連邦の機構 = dotfiles land.py・先例 = dotfiles 裁定 2026-08-16
# decision-land-speculation-enable / herdr-hud D568)。窓は確定 train(消費済み
# 緑の先端・公開対象)と投機 tip を分け、gate の実行だけを backend へ並列に
# 発注する(判定の消費は直列同値・赤 1 便で窓ごと abort する形の根治)。厳密 bool。
# 戻し方 = この行を外す便を着地させる(既定 off・law opt-in-inert)。
speculation = true
# 検査 backend(law policy-in-toml)。重い cold build を重ねて飽和機の load を倍にしない保守初期値。
# 実測(last_run.speculation)を見て上げる — 恒久解 = L440 の k3s self-hosted
# runner(external backend 段 2)への移設。
[gate.backend]
kind = "local"
max_parallel = 1
join_s = 60

[gate.tiers]
"docs/adr/" = "PYTHONUNBUFFERED=1 uv run pytest docs/adr -q"
"docs/" = "true"
"notes/" = "true"
"README.md" = "true"
".agents/land-queue.toml" = "true"

[policy]
run_executors = ["landrun-orch", "landrun-rollout", "machine"]
auto_run = true
urgent_slots = 1
push = "origin"
base_move_follow_retries = 2
# 日次検証の全走が緑の断面だけが昇格する(R-7a95702d)
stable_branch = "stable"
